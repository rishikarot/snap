const $=s=>document.querySelector(s);const icon=(name)=>{const paths={clipboard:'<rect x="5" y="5" width="14" height="17" rx="2"/><path d="M9 5V3h6v2M9 12h6M9 16h4"/>','check-circle':'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',home:'<path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3z"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',more:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',back:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',check:'<path d="m5 12 4 4L19 6"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4 5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 9h18M16 15h2"/>',pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2"/>',alert:'<path d="M12 3 2 21h20L12 3z"/><path d="M12 9v5M12 18h.01"/>',filter:'<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>'};return `<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||paths.folder}</svg>`};
const seedProjects=[{id:1,name:'Kochi Tower A',supervisor:1,workers:12,present:9,half:1,progress:72,budget:1000000,other:210000,expenses:80000,issues:1,updates:4},{id:2,name:'Warehouse Fitout',supervisor:2,workers:10,present:7,half:1,progress:54,budget:750000,other:190000,expenses:90000,issues:2,updates:3},{id:3,name:'Aluva Service Hub',supervisor:3,workers:8,present:7,half:0,progress:88,budget:480000,other:80000,expenses:45000,issues:0,updates:5},{id:4,name:'Edappally Office',supervisor:0,workers:6,present:5,half:0,progress:65,budget:300000,other:42000,expenses:24000,issues:0,updates:2},{id:5,name:'Airport Logistics',supervisor:4,workers:14,present:10,half:2,progress:39,budget:900000,other:250000,expenses:115000,issues:3,updates:1}];
const supervisors=[{id:1,name:'Suresh Kumar',initials:'SK',site:1,day:'9:15 AM',checkin:'9:42 AM',sync:'11:36 AM',status:'On site'},{id:2,name:'Anil Mathew',initials:'AM',site:2,day:'9:30 AM',checkin:'10:05 AM',sync:'11:20 AM',status:'On site'},{id:3,name:'Rajesh Nair',initials:'RN',site:3,day:'9:20 AM',checkin:'9:55 AM',sync:'11:30 AM',status:'On site'},{id:4,name:'Meera Joseph',initials:'MJ',site:0,day:'9:10 AM',checkin:'—',sync:'10:40 AM',status:'Working'},{id:5,name:'Vishnu Das',initials:'VD',site:0,day:'—',checkin:'—',sync:'Yesterday',status:'Not started'}];
const workerRates=[{name:'Mason',count:4,rate:900,unit:'day',hours:8},{name:'Electrician',count:3,rate:160,unit:'hour',hours:8},{name:'Helper',count:3,rate:650,unit:'day',hours:8},{name:'Site technician',count:2,rate:125,unit:'hour',hours:6}];
let store={};try{store=JSON.parse(localStorage.getItem('snapOwnerMvp')||'{}')||{}}catch{};store.expenses=store.expenses||[{id:1,project:1,category:'Materials',amount:4500,notes:'Consumables',date:'2026-10-28',status:'Pending'},{id:2,project:2,category:'Transport',amount:2500,notes:'Vehicle hire',date:'2026-10-28',status:'Approved'}];store.approvals=store.approvals||[{id:1,type:'Expense',title:'Materials · Kochi Tower A',amount:4500,status:'Pending'},{id:2,type:'Leave',title:'Leave request · Suresh Kumar',amount:0,status:'Pending'},{id:3,type:'Expense',title:'Transport · Warehouse Fitout',amount:2500,status:'Pending'}];store.mode=store.mode||'default';store.accent=store.accent||'#ffd235';const persist=()=>{try{localStorage.setItem('snapOwnerMvp',JSON.stringify(store))}catch{}};
let page='login',projectId=1,supervisorId=1,tab='Overview',period='Today',projectFilter='all',search='',modal='',expenseCategory='Materials';const project=id=>seedProjects.find(p=>p.id===id);const supervisor=id=>supervisors.find(s=>s.id===id);
const liveSnapshot=()=>SNAPShared.read();
const linkedProject=p=>liveSnapshot()?.projects?.[p.name]||null;
const liveWorkers=p=>linkedProject(p)?.workers||null;
const liveWorks=p=>linkedProject(p)?.works||null;
function syncSharedOwner(){
  const snap=liveSnapshot();if(!snap)return;
  for(const p of seedProjects){const workers=liveWorkers(p);if(workers){p.workers=workers.length;p.present=workers.filter(w=>w.status==='P').length;p.half=workers.filter(w=>w.status==='H').length;}}
  const john=supervisors.find(s=>s.id===1);
  if(john&&snap.supervisor){const sup=snap.supervisor;john.name='John';john.initials='J';john.status=sup.siteName?'On site':sup.started?'Working':'Not started';john.site=seedProjects.find(p=>p.name===sup.siteName)?.id||0;john.day=sup.startAt?new Date(sup.startAt).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):'—';john.checkin=sup.siteAt?new Date(sup.siteAt).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):'—';john.sync=new Date(snap.updatedAt).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});}
}
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Labor rate values below simulate rates returned by the server. The daily cost is a snapshot, not a monthly P&L.
function labor(p){let base=workerRates.reduce((sum,w)=>sum+w.count*w.rate*(w.unit==='hour'?w.hours:1),0);let fraction=(p.present+.5*p.half)/p.workers;return Math.round(base*fraction)}
function projectExpenses(p){return p.expenses+store.expenses.filter(e=>e.project===p.id&&e.status==='Approved').reduce((a,e)=>a+Number(e.amount),0)}
function costs(p){const shared=liveWorkers(p);if(shared){const rateByJob={'Mason':{rate:900,unit:'day'},'Helper':{rate:650,unit:'day'},'Electrician':{rate:160,unit:'hour',hours:8},'Painter':{rate:850,unit:'day'}};const labor=shared.reduce((sum,w)=>{const r=rateByJob[w.job]||{rate:750,unit:'day'};const base=r.rate*(r.unit==='hour'?(r.hours||8):1);return sum+base*(w.status==='P'?1:w.status==='H'?.5:0)},0);const extras=(liveSnapshot()?.expenses||[]).filter(e=>String(e.project)===String(({ 'Kochi Tower A':0,'Edappally Office':3,'Airport Logistics':10})[p.name])).reduce((n,e)=>n+Number(e.amount||0),0);const expenses=projectExpenses(p)+extras;return {labor:Math.round(labor),expenses,other:p.other,total:Math.round(labor)+expenses+p.other}}return {labor:Math.round(labor(p)*20),expenses:projectExpenses(p),other:p.other,total:Math.round(labor(p)*20)+projectExpenses(p)+p.other}} // 20 attendance days illustrative month-to-date; must be replaced by actual daily attendance ledger.
function health(p){const c=costs(p),spent=c.total/p.budget;return spent>p.progress/100+.15?'Watch':p.issues>=3?'Attention':'On track'}
function go(p){page=p;render();window.scrollTo(0,0)}function openProject(id){projectId=id;tab='Overview';go('project')}function openSupervisor(id){supervisorId=id;go('supervisor')}function goBack(){if(page==='project'||page==='supervisors'||page==='finance'||page==='approvals'||page==='alerts')go('home');else if(page==='supervisor')go('supervisors');else if(page==='workDetail')go('project');else if(page==='expense')go('finance');else go('home')}
function pageTop(title){return `<div class="topline"><button class="back" onclick="goBack()" aria-label="Back">${icon('back')}</button><h2>${esc(title)}</h2></div>`}function bottom(){return `<div class="subnav"><button aria-label="Back" onclick="goBack()">${icon('back')}</button></div>`}function nav(){return `<nav class="nav">${[['home','Home','home'],['projects','Projects','folder'],['more','More','more']].map(([id,label,ic])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${icon(ic)}${label}</button>`).join('')}</nav>`}
function login(){return `<div class="page login"><div><div class="login-top"><div class="logo"><span class="mark">S</span>SNAP</div><a class="launcher-link" href="index.html" aria-label="Back to demo selection">← All demos</a></div><div class="intro"><h1>Welcome back.</h1><p class="muted">A simpler way to get things done.<br>One place for your projects and team.</p></div><form onsubmit="return signIn(event)"><div class="field" style="margin-top:35px"><label>USERNAME OR WORK EMAIL</label><input id="username" autocomplete="username" value="don" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" value="demo123" required></div><p id="loginError" style="color:#bd6547;font-size:12px"></p><button class="btn wide" type="submit">Continue to SNAP</button><details class="demo-login-info"><summary><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/></svg> Login info</summary><div class="demo-login-panel">Username: <b>don</b><br>Password: <b>demo123</b></div></details></form></div><p class="muted small" style="text-align:center">Projects made simple. <span style="color:#cda200">●</span></p></div>`}function signIn(e){e.preventDefault();let u=$('#username').value.trim().toLowerCase(),p=$('#password').value;if(['don','don@demo.com'].includes(u)&&p==='demo123')go('home');else $('#loginError').textContent='Use don / demo123';return false}
function home(){let totalWorkers=seedProjects.reduce((s,p)=>s+p.workers,0),present=seedProjects.reduce((s,p)=>s+p.present,0),half=seedProjects.reduce((s,p)=>s+p.half,0),visible=projectFilter==='all'?seedProjects:seedProjects.filter(p=>String(p.id)===projectFilter);return `<div class="page"><div class="head"><div class="logo"><span class="mark">S</span>SNAP</div><div class="row"><button class="iconbtn" onclick="go('alerts')" aria-label="Alerts">${icon('bell')}</button><button class="avatar" onclick="ownerAvatar()" aria-label="Profile">D</button></div></div><p class="muted small" style="margin:23px 0 3px">Wednesday, 28 October · Demo snapshot</p><h1 class="title">Good morning, Don</h1><p class="muted small" style="margin:0">Your projects, people and priorities.</p><div class="section"><h3>Field at a glance</h3><div class="filterrow"><select aria-label="Period" onchange="period=this.value;render()"><option ${period==='Today'?'selected':''}>Today</option><option ${period==='7 days'?'selected':''}>7 days</option><option ${period==='This month'?'selected':''}>This month</option></select><button class="iconbtn" aria-label="Filter projects" onclick="showFilters()">${icon('filter')}</button></div></div><div class="grid4">${[[`${present}/${totalWorkers}`,'Present','users'],[supervisors.filter(s=>s.status==='On site').length,'On site','pin'],[visible.reduce((s,p)=>s+p.updates,0),'Updates','clipboard'],[visible.reduce((s,p)=>s+p.issues,0),'Issues','alert']].map(([n,l,ic])=>`<div class="stat"><span class="stat-icon">${icon(ic)}</span><b>${n}</b><small>${l}</small></div>`).join('')}</div><p class="hint">Presence is the latest snapshot. Updates and issues use sample period totals.</p><div class="section"><h3>Needs attention</h3><button class="link" onclick="go('alerts')">View all ›</button></div><div class="card"><div class="listrow" onclick="go('approvals')"><span class="dot warn"></span><div class="grow"><strong>3 approvals pending</strong><small>Expenses and leave requests</small></div>${icon('right')}</div><div class="listrow" onclick="openProject(5)"><span class="dot warn"></span><div class="grow"><strong>Airport Logistics needs review</strong><small>Cost exposure and 3 open issues</small></div>${icon('right')}</div><div class="listrow" onclick="go('supervisors')"><span class="dot warn"></span><div class="grow"><strong>2 supervisors not on site</strong><small>Working remotely or not started</small></div>${icon('right')}</div></div><div class="section"><h3>Supervisors now</h3><button class="link" onclick="go('supervisors')">View all ›</button></div><div class="card">${supervisors.slice(0,3).map(s=>`<div class="listrow" onclick="openSupervisor(${s.id})"><span class="dot"></span><div class="grow"><strong>${s.name}</strong><small>${project(s.site)?.name||'No active site'} · Checked in ${s.checkin}</small></div>${icon('right')}</div>`).join('')}</div><div class="section"><h3>Project health</h3><button class="link" onclick="go('projects')">All projects ›</button></div><div class="card">${seedProjects.slice(0,3).map(p=>`<div class="listrow" onclick="openProject(${p.id})"><div class="grow"><strong>${p.name}</strong><small>${p.progress}% complete · ${money(costs(p).total)} recorded cost</small></div><span class="pill ${health(p)==='On track'?'good':'warn'}">${health(p)}</span></div>`).join('')}</div>${nav()}</div>`}
function showFilters(){showModal(`<h3>Filter field overview</h3><div class="field"><label>PROJECT</label><select id="filterProject"><option value="all">All projects</option>${seedProjects.map(p=>`<option value="${p.id}" ${projectFilter==p.id?'selected':''}>${p.name}</option>`).join('')}</select></div><button class="btn wide" onclick="projectFilter=$('#filterProject').value;closeModal();render()">Apply filter</button>`)}
function projectsPage(){let arr=seedProjects.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));return `<div class="page"><div class="head"><h2>Projects</h2><button class="avatar" onclick="ownerAvatar()">D</button></div><p class="muted small">Project progress, field activity and financial health</p><input class="search" placeholder="Search projects" value="${esc(search)}" oninput="search=this.value;renderProjects()"><div id="projectResults">${projectRows(arr)}</div>${nav()}</div>`}function projectRows(arr){return `<div class="card" style="margin-top:14px">${arr.map(p=>`<div class="listrow" onclick="openProject(${p.id})"><div class="grow"><strong>${p.name}</strong><small>${p.present}/${p.workers} present · ${p.progress}% work · ${money(costs(p).total)} cost</small></div><span class="pill ${health(p)==='On track'?'good':'warn'}">${health(p)}</span>${icon('right')}</div>`).join('')||'<p class="muted">No projects found</p>'}</div>`}function renderProjects(){$('#projectResults').innerHTML=projectRows(seedProjects.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())))}

const workerNames=['Arun Nair','Biju Thomas','Faisal Ali','Hari Krishnan','Jomon Joseph','Kiran Das','Manu Raj','Nikhil Varma','Pradeep Kumar','Rahul Menon','Sanjay P','Vivek S','Akhil Mathew','Deepak S'];
const workerJobs=['Mason','Electrician','Helper','Site technician','Mason','Helper','Electrician','Site technician'];
function projectWorkers(p){if(liveWorkers(p))return liveWorkers(p).map(w=>({...w,checkin:w.status==='A'?'—':'Recorded by John'}));return Array.from({length:p.workers},(_,i)=>{let status=i<p.present?'P':i<p.present+p.half?'H':'A';return {id:p.id*100+i+1,name:workerNames[(i+(p.id-1)*3)%workerNames.length],job:workerJobs[i%workerJobs.length],status,checkin:status==='A'?'—':`0${8+i%2}:${String(15+(i*7)%40).padStart(2,'0')} AM`}})}
function attendanceWorkers(p){return `<div class="section"><h3>Worker attendance</h3><span class="pill">${p.workers} workers · View only</span></div><div class="card attendance-workers">${projectWorkers(p).map(w=>`<div class="listrow workerrow"><span class="worker-avatar">${w.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</span><div class="grow"><strong>${esc(w.name)}</strong><small>${esc(w.job)} · ${w.status==='A'?'Not checked in':'Checked in '+w.checkin}</small></div><span class="attendance-state ${w.status==='P'?'present':w.status==='H'?'half':'absent'}">${w.status==='P'?'Present':w.status==='H'?'Half day':'Absent'}</span></div>`).join('')}</div><p class="hint">Shared offline records appear here after John saves attendance. Other records are illustrative.</p>`}
const workTasks=[{id:1,title:'Site installation',status:'In progress',description:'Install and verify the planned site equipment and complete the associated work checklist.',assignee:'Field supervisor',due:'Today',updates:[{at:'11:20 AM',by:'Field supervisor',text:'Installation progressed. Photos and measurements captured.'},{at:'9:55 AM',by:'Field supervisor',text:'Started installation checks at site.'}]},{id:2,title:'Safety inspection',status:'Open',description:'Review safety readiness, equipment placement and any outstanding observations before handover.',assignee:'Field supervisor',due:'Today',updates:[{at:'10:45 AM',by:'Field supervisor',text:'Safety walkthrough planned for the afternoon.'}]}];
let selectedWorkId=1;
function worksPanel(p){const items=liveWorks(p)||workTasks;return `<div class="card">${items.map(w=>`<button class="listrow task-button" onclick="openWork(${w.id})"><div class="grow"><strong>${esc(w.title)}</strong><small>${w.pct!=null?w.pct+'% complete · '+(w.updates?.length||0)+' updates':(w.id===1?p.progress+'% complete · Updated 11:20 AM':'Open · Due today')}</small></div>${icon('right')}</button>`).join('')}</div>`}
function openWork(id){selectedWorkId=id;go('workDetail')}
function workDetailPage(){let p=project(projectId),items=liveWorks(p)||workTasks,w=items.find(x=>String(x.id)===String(selectedWorkId))||items[0];if(!w)return `<div class='page'>${pageTop('Work details')}<p class='muted'>No work records</p>${bottom()}</div>`;w={...w,status:w.status||(w.pct>=100?'Completed':'In progress'),description:w.description||'Supervisor work record',assignee:w.assignee||w.owner||'John',updates:(w.updates||[]).map(u=>({by:u.by||'John',at:u.at||'Recently',text:u.text||'Work updated'}))};return `<div class="page">${pageTop(w.title)}<div class="row between" style="margin:14px 0"><span class="pill">${esc(w.status)}</span><span class="pill">View only</span></div><div class="card"><span class="eyebrow">PROJECT</span><h3 style="margin:7px 0 0">${esc(p.name)}</h3><div class="section"><h3>Work details</h3></div><p style="line-height:1.6;margin-top:0">${esc(w.description)}</p><div class="costrow"><span class="muted">Assigned to</span><strong>${esc(w.assignee)}</strong></div><div class="costrow"><span class="muted">Due</span><strong>${esc(w.due)}</strong></div><div class="costrow"><span class="muted">Progress</span><strong>${w.pct!=null?w.pct+'%':(w.id===1?p.progress+'%':'Not started')}</strong></div></div><div class="section"><h3>Latest updates</h3></div><div class="card">${w.updates.map(u=>`<div class="listrow"><div class="grow"><strong>${esc(u.by)} · ${u.at}</strong><small style="line-height:1.6">${esc(u.text)}</small></div></div>`).join('')}</div><p class="notice" style="margin-top:16px">Owner access is read-only. Field updates and attachments are recorded by the assigned supervisor.</p>${bottom()}</div>`}

function projectPage(){let p=project(projectId),s=supervisor(p.supervisor),c=costs(p),percent=Math.round(100*p.present/p.workers);return `<div class="page">${pageTop(p.name)}<div class="row between"><div><span class="eyebrow">PROJECT OVERVIEW</span><h2 style="margin:5px 0">${p.progress}% work completed</h2></div><span class="pill ${health(p)==='On track'?'good':'warn'}">${health(p)}</span></div><div class="progress"><i style="width:${p.progress}%"></i></div><div class="tabs">${['Overview','Attendance','Works','Financials','Docs','History'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${tab==='Overview'?`<div class="card soft"><span class="eyebrow">SUPERVISOR PRESENCE</span>${s?`<div class="listrow" onclick="openSupervisor(${s.id})"><span class="dot"></span><div class="grow"><strong>${s.name}</strong><small>${s.status} · ${s.checkin} · Last sync ${s.sync}</small></div>${icon('right')}</div>`:'<p class="muted small">No supervisor currently assigned</p>'}</div><div class="section"><h3>Today's field status</h3></div><div class="grid4">${[[p.workers,'Total'],[p.present,'Present'],[p.half,'Half day'],[p.workers-p.present-p.half,'Absent']].map(([n,l])=>`<div class="stat"><b>${n}</b><small>${l}</small></div>`).join('')}</div><div class="section"><h3>Project health</h3></div><div class="two"><div class="card"><span class="eyebrow">FINANCIAL</span><div class="number">${Math.round(c.total/p.budget*100)}%</div><small class="muted">Budget utilized</small><div class="progress" style="margin-top:10px"><i style="width:${Math.min(100,c.total/p.budget*100)}%"></i></div></div><div class="card"><span class="eyebrow">WORKFORCE</span><div class="number">${percent}%</div><small class="muted">Present today</small><div class="progress" style="margin-top:10px"><i style="width:${percent}%"></i></div></div></div><div class="section"><h3>Cost snapshot</h3><button class="link" onclick="tab='Financials';render()">Details ›</button></div><div class="card">${costRows(p)}</div><div class="section"><h3>Latest activity</h3></div><div class="card"><div class="listrow"><span class="dot"></span><div class="grow"><strong>Work update received</strong><small>Today · 11:20 AM · Sample</small></div></div><div class="listrow"><span class="dot"></span><div class="grow"><strong>Attendance submitted</strong><small>Today · 10:15 AM · Sample</small></div></div></div>`:tab==='Attendance'?`<div class="section"><h3>Attendance status</h3><span class="pill">Read only</span></div><div class="grid4">${[[p.workers,'Total'],[p.present,'Present'],[p.half,'Half day'],[p.workers-p.present-p.half,'Absent']].map(([n,l])=>`<div class="stat"><b>${n}</b><small>${l}</small></div>`).join('')}</div><p class="notice" style="margin-top:15px">${percent}% present · Recorded by field supervisor. Latest sync ${linkedProject(p)?new Date(linkedProject(p).updatedAt).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):'11:36 AM (sample)'}.</p>${attendanceWorkers(p)}`:tab==='Works'?worksPanel(p):tab==='Financials'?financialPanel(p):tab==='Docs'?'<div class="card"><div class="listrow"><strong>Project scope.pdf</strong></div><div class="listrow"><strong>Site photos</strong></div><div class="listrow"><strong>Approved drawings</strong></div></div>':'<div class="card"><div class="timeline"><div><strong>11:20 AM</strong><p class="muted small">Progress updated by supervisor</p></div><div><strong>10:15 AM</strong><p class="muted small">Attendance submitted</p></div><div><strong>9:42 AM</strong><p class="muted small">Supervisor checked in</p></div></div></div>'}${bottom()}</div>`}
function costRows(p){let c=costs(p);return `<div class="costrow"><span>Attendance-based labor · latest recorded day*</span><b>${money(c.labor)}</b></div><div class="costrow"><span>Project-tagged expenses</span><b>${money(c.expenses)}</b></div><div class="costrow"><span>Other recorded costs</span><b>${money(c.other)}</b></div><div class="costrow"><strong>Total recorded cost</strong><strong>${money(c.total)}</strong></div><div class="costrow"><span>Project budget</span><b>${money(p.budget)}</b></div>`}
function financialPanel(p){let c=costs(p);return `<div class="section"><h3>Project financials</h3><span class="pill">Demo cost view*</span></div><div class="two"><div class="card"><span class="eyebrow">RECORDED COST</span><div class="number">${money(c.total)}</div></div><div class="card"><span class="eyebrow">BUDGET LEFT</span><div class="number">${money(p.budget-c.total)}</div></div></div><div class="section"><h3>Cost breakdown</h3></div><div class="card">${costRows(p)}</div><div class="section"><h3>Labor calculation</h3></div><div class="card">${workerRates.map(w=>`<div class="costrow"><span>${w.count} × ${w.name}<br><small class="muted">${money(w.rate)}/${w.unit}${w.unit==='hour'?' × '+w.hours+'h':''}</small></span><b>${money(w.count*w.rate*(w.unit==='hour'?w.hours:1))}/day</b></div>`).join('')}</div><p class="hint">*For projects with shared attendance, labor is calculated for the latest recorded day using illustrative rates; other projects retain demo month-to-date estimates. This is not a historical cost ledger or profit figure.</p><div class="section"><h3>Tagged expenses</h3><button class="link" onclick="go('expense')">+ Tag expense</button></div><div class="card">${store.expenses.filter(e=>e.project===p.id).map(e=>`<div class="costrow"><span>${esc(e.category)} · ${esc(e.notes)}<br><small class="muted">${e.status}</small></span><b>${money(e.amount)}</b></div>`).join('')||'<p class="muted small">No additional tagged expenses</p>'}</div>`}
function supervisorsPage(){return `<div class="page">${pageTop('Supervisors')}<div class="grid4">${[[3,'On site'],[1,'Working'],[1,'Not started'],[5,'Total']].map(([n,l])=>`<div class="stat"><b>${n}</b><small>${l}</small></div>`).join('')}</div><div class="section"><h3>Current presence</h3></div><div class="card">${supervisors.map(s=>`<div class="listrow" onclick="openSupervisor(${s.id})"><span class="dot ${s.status==='On site'?'':s.status==='Working'?'warn':'off'}"></span><div class="grow"><strong>${s.name}</strong><small>${project(s.site)?.name||'No active site'} · ${s.status}</small></div>${icon('right')}</div>`).join('')}</div><p class="hint">Check-in events are not continuous location tracking. Always verify last sync.</p>${bottom()}</div>`}
function supervisorPage(){let s=supervisor(supervisorId);return `<div class="page">${pageTop('Supervisor')}<div class="card"><div class="row"><div class="avatar" style="display:grid;place-items:center">${s.initials}</div><div class="grow"><strong>${s.name}</strong><p class="muted small" style="margin:3px 0">${s.status}</p></div></div></div><div class="section"><h3>Today's activity</h3></div><div class="card"><div class="costrow"><span>Day started</span><b>${s.day}</b></div><div class="costrow"><span>Site check-in</span><b>${s.checkin}</b></div><div class="costrow"><span>Current project</span><b>${project(s.site)?.name||'None'}</b></div><div class="costrow"><span>Last sync</span><b>${s.sync}</b></div></div>${s.site?`<button class="btn secondary wide" style="margin-top:15px" onclick="openProject(${s.site})">Open current project</button>`:''}<div class="section"><h3>Recent activity</h3></div><div class="card"><div class="timeline"><div><strong>11:20 AM</strong><p class="muted small">Work progress submitted</p></div><div><strong>10:15 AM</strong><p class="muted small">Attendance submitted</p></div></div></div>${bottom()}</div>`}
function financePage(){let sum=seedProjects.reduce((a,p)=>a+costs(p).total,0),budget=seedProjects.reduce((a,p)=>a+p.budget,0);return `<div class="page">${pageTop('Financials')}<div class="two"><div class="card"><span class="eyebrow">RECORDED COST</span><div class="number">${money(sum)}</div></div><div class="card"><span class="eyebrow">TOTAL BUDGET</span><div class="number">${money(budget)}</div></div></div><p class="hint">Demo month-to-date estimate; financial health requires actual attendance and cost ledgers.</p><div class="section"><h3>Projects</h3><button class="link" onclick="go('expense')">+ Expense</button></div><div class="card">${seedProjects.map(p=>`<div class="listrow" onclick="openProject(${p.id});tab='Financials';render()"><div class="grow"><strong>${p.name}</strong><small>${money(costs(p).total)} / ${money(p.budget)} · ${p.progress}% work</small></div><span class="pill ${health(p)==='On track'?'good':'warn'}">${health(p)}</span></div>`).join('')}</div>${bottom()}</div>`}
function approvalsPage(){return `<div class="page">${pageTop('Approvals')}<div class="section"><h3>Pending review</h3></div><div class="card">${store.approvals.map(a=>`<div class="listrow"><div class="grow"><strong>${esc(a.title)}</strong><small>${a.type} ${a.amount?money(a.amount):''} · ${a.status}</small></div>${a.status==='Pending'?`<button class="chip" onclick="review(${a.id})">Review</button>`:''}</div>`).join('')}</div>${bottom()}</div>`}function review(id){let a=store.approvals.find(x=>x.id===id);showModal(`<h3>${esc(a.title)}</h3><p class="muted">${a.type} · ${a.amount?money(a.amount):'No amount'}</p><div class="two"><button class="btn secondary" onclick="decide(${id},'Rejected')">Reject</button><button class="btn" onclick="decide(${id},'Approved')">Approve</button></div>`)}function decide(id,status){let a=store.approvals.find(x=>x.id===id);a.status=status;if(a.type==='Expense'){let e=store.expenses.find(e=>e.id===id);if(e)e.status=status}persist();closeModal();render()}
function alertsPage(){return `<div class="page">${pageTop('Alerts')}<div class="card">${[['3 approvals waiting','approvals'],['Airport Logistics cost and issue review','project'],['Supervisors not checked in','supervisors']].map(([t,d])=>`<div class="listrow" onclick="${d==='project'?'openProject(5)':`go('${d}')`}"><span class="dot warn"></span><div class="grow"><strong>${t}</strong><small>Sample operational alert</small></div>${icon('right')}</div>`).join('')}</div>${bottom()}</div>`}
function expensePage(){return `<div class="page">${pageTop('Tag expense')}<p class="muted small">Project tagging · Owner demo</p><div class="field"><label>CATEGORY</label><div class="row" style="flex-wrap:wrap">${['Materials','Transport','Meals','Equipment','Other'].map(c=>`<button class="chip ${expenseCategory===c?'active':''}" onclick="expenseCategory='${c}';render()">${c}</button>`).join('')}</div></div><div class="field"><label>AMOUNT (₹)</label><input id="expAmount" type="number" min="1" placeholder="Enter amount"></div><div class="field"><label>PROJECT</label><select id="expProject">${seedProjects.map(p=>`<option value="${p.id}" ${p.id===projectId?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="field"><label>NOTES</label><textarea id="expNotes" rows="3" placeholder="What was this expense for?"></textarea></div><div class="field"><label>RECEIPT / PHOTO</label><input type="file" id="expFile" accept="image/*" multiple></div><p class="hint">Receipts are selected locally in this demo, not uploaded.</p><div class="subnav"><button onclick="goBack()">${icon('back')}</button><button onclick="saveExpense()">${icon('check')}</button></div></div>`}function saveExpense(){let amount=Number($('#expAmount').value),p=Number($('#expProject').value);if(!(amount>0)){alert('Enter a valid amount');return}let id=Date.now();let note=$('#expNotes').value.trim();store.expenses.push({id,project:p,category:expenseCategory,amount,notes:note,date:'2026-10-28',status:'Pending'});store.approvals.push({id,type:'Expense',title:`${expenseCategory} · ${project(p).name}`,amount,status:'Pending'});persist();projectId=p;go('finance')}
function morePage(){return `<div class="page"><div class="head"><h2>More</h2><button class="avatar" onclick="ownerAvatar()">D</button></div><div class="card" style="margin-top:18px">${[['Supervisors','supervisors'],['Financials','finance'],['Approvals','approvals'],['Alerts','alerts'],['Profile & appearance','profile']].map(([t,p])=>`<div class="listrow" onclick="go('${p}')"><div class="grow"><strong>${t}</strong></div>${icon('right')}</div>`).join('')}</div>${nav()}</div>`}
function profilePage(){return `<div class="page">${pageTop('Profile')}<div class="card"><strong>Don</strong><p class="muted small">Business owner · don@demo.com</p></div><button class="btn wide" style="margin-top:18px" onclick="openOwnerProfile()">Appearance & account</button>${bottom()}</div>`}
const ownerPalette=[['#ffd235','Yellow'],['#4479d5','Blue'],['#31936c','Green'],['#8d65bc','Purple'],['#d66c50','Coral'],['#586475','Slate']];
store.secondary=store.secondary||'#817036';

function openOwnerProfile(){showModal(`<div class="owner-profile"><div class="profile-head"><h2>Don</h2><button class="profile-close" aria-label="Close profile" onclick="closeModal()">×</button></div><p class="muted profile-sub">Business owner · don@demo.com</p><div class="profile-label">APPEARANCE</div><div class="profile-modes">${[['default','Default'],['light','Light'],['dark','Dark']].map(([m,l])=>`<button class="profile-mode ${store.mode===m?'selected':''}" onclick="setMode('${m}')">${store.mode===m?'<span class="selected-check">✓</span>':''}${l}</button>`).join('')}</div><div class="profile-label">ACCENT COLOR</div><div class="profile-swatches">${ownerPalette.map(([c,n])=>`<button class="profile-swatch" aria-label="${n}" title="${n}" onclick="setAccent('${c}')" style="background:${c}"></button>`).join('')}<button class="profile-swatch rainbow" title="Custom accent" aria-label="Custom accent" onclick="document.getElementById('ownerPrimary').click()"></button></div><div class="profile-custom"><label>Custom primary <input id="ownerPrimary" type="color" value="${store.accent}" onchange="setAccent(this.value)"></label><label>Secondary <input type="color" value="${store.secondary}" onchange="setSecondary(this.value)"></label></div><p class="muted profile-hint">Selecting a custom primary automatically suggests a matching secondary. You can adjust either color.</p><button class="btn wide profile-logout" onclick="window.location.href='index.html'">Log out</button></div>`)}
