function attendance(){const locked=isAttendanceLocked()&&!attendanceUnlocked;const total=workers.length;const present=workers.filter(w=>status(w.id).v==='P').length;const half=workers.filter(w=>status(w.id).v==='H').length;const absent=workers.filter(w=>status(w.id).v==='A').length;const percent=Math.round(present/total*100);if(locked){return `<h3 class="summary-title">ATTENDANCE STATUS · TODAY</h3><div class="stats attendance-summary">${[['Total',total],['Present',present],['Half day',half],['Absent',absent]].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')}</div><div class="attendance-percent"><div class="top"><div><strong>${percent}%</strong><div class="note">Present out of ${total} workers</div></div><span class="lockline"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Locked</span></div><div class="progress"><i style="width:${percent}%"></i></div></div><p class="note">Attendance saved for this project. Any correction requires a reason and an active site check-in.</p><button class="primary" style="margin-top:18px" onclick="unlockAttendance()"><svg class="ico" style="vertical-align:middle;margin-right:7px;width:17px;height:17px" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0"/></svg>Unlock to correct attendance</button>`}

function expense(){return `<div class="page">${head('Tag expense')}<div class="scroll"><div class="field"><label>AMOUNT (₹)</label><input id="amount" type="number" min="1" placeholder="0.00" inputmode="decimal"></div><div class="eyebrow">CATEGORY</div><div class="chips" id="expenseChips">${['Materials','Labour','Fuel','Food','Equipment','Travel','Other'].map((c,i)=>`<button class="chip ${i===0?'active':''}" onclick="pickChip(this,'expenseChips')">${c}</button>`).join('')}</div><div class="field"><label>PROJECT (OPTIONAL)</label><select id="expenseProject"><option value="">No project</option>${projects.map(p=>`<option value="${p.id}" ${data.site===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="field"><label>NOTE</label><textarea id="expenseNote" placeholder="What was this expense for?"></textarea></div>${photoPicker()}</div>${floats()}</div>`};function leave(){return `<div class="page">${head('Tag leave')}<div class="scroll"><div class="eyebrow">LEAVE TYPE</div><div class="chips" id="leaveChips">${['Annual','Sick','Casual','Unpaid','Other'].map((c,i)=>`<button class="chip ${i===0?'active':''}" onclick="pickChip(this,'leaveChips')">${c}</button>`).join('')}</div><div class="field"><label>FROM</label><input id="leaveFrom" type="date" value="2026-10-28"></div><div class="field"><label>TO</label><input id="leaveTo" type="date" value="2026-10-28"></div><div class="field"><label>REASON</label><textarea id="leaveReason" placeholder="Add a short reason…"></textarea></div><p class="note">Your leave request will be saved locally in this prototype.</p></div>${floats()}</div>`};function pickChip(el,id){$('#'+id).querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));el.classList.add('active')};function submitPage(){if((page==='project'||page==='work')&&!canEditProject()){editDenied();return}if(page==='project'&&tab==='Attendance'){if(isAttendanceLocked()&&!attendanceUnlocked)return;data.attendanceLocks=data.attendanceLocks||{};data.atten
