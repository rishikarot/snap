function renderAttendance(){const s=site(route.siteId);if(!s)return renderSites();const on=isChecked(s.id),a=attStats(s.id),k=dayKey(s.id),submitted=data.submissions[k],workers=s.workers.map(wid=>data.workers.find(w=>w.id===wid)).filter(Boolean);const list=workers.filter(w=>route.attFilter==='all'||route.attFilter==='pending'&&!attendance(s.id,w.id)||route.attFilter==='exceptions'&&attendance(s.id,w.id)?.status!=='full'&&Boolean(attendance(s.id,w.id)));return `<div style="padding-top:17px"><button class="back" data-site="${s.id}">${I('left',16)} ${esc(s.name)}</button></div>${sectionIntro('Site crew','Crew attendance',`Today · ${s.name}`)}${!on?`<div class="softpanel" style="margin-bottom:15px"><div class="between"><div><h3>Check in to mark attendance</h3><p class="help">Attendance editing is available during an active visit.</p></div><button class="btn dark tiny" data-act="checkin" data-id="${s.id}">Check in</button></div></div>`:''}<div class="card cardpad"><div class="between"><div><span class="muted small">Marked today</span><div style="margin-top:5px"><strong style="font-size:29px;letter-spacing:-.6px">${a.marked}</strong><span class="muted"> / ${a.total}</span></div></div><span class="pill ${a.pending===0?'green':''}">${a.pending===0?'All marked':`${a.pending} pending`}</span></div><div class="progress" style="margin-top:13px"><i style="width:${a.total?Math.round(a.marked/a.total*100):100}%"></i></div><div class="metricrow" style="margin-top:15px"><div class="metric"><strong>${a.full}</strong><small>Full day</small></div><div class="metric"><strong>${a.half}</strong><small>Half day</small></div><div class="metric"><strong>${a.absent}</strong><small>Absent</small></div><div class="metric"><strong>${a.pending}</strong><small>Pending</small></div></div>${submitted?`<p class="help">${I('checkcircle',13)} Submitted ${fmtDateTime(submitted)}. Later edits require resubmission.</p>`:''}</div><div class="section"><div class="between" style="margin-bottom:11px"><h2>Workers <span class="muted" style="font-weight:450">(${workers.length})</span></h2>${on?`<button class="btn outline tiny" data-act="bulk-select">${I('users',14)} Bulk select</button>`:''}</div>${on?`<button class="btn dark full" data-act="mark-pending" ${!a.pending?'disabled':''}>${I('check',18)} Mark ${a.pending} pending as full day</button>`:''}<div class="filterbar" style="margin-top:13px">${[['all','All'],['pending',`Pending (${a.pending})`],['exceptions','Exceptions']].map(([id,label])=>`<button class="filterchip ${route.attFilter===id?'on':''}" data-attfilter="${id}">${label}</button>`).join('')}</div><div class="card cardpad" style="padding-top:4px;padding-bottom:4px" id="worker-list">${list.map(w=>renderWorker(s.id,w,on)).join('')||empty('Nothing here','Change the filter to see more workers.','users')}</div></div>${on?`<div class="section"><button class="btn ${a.pending===0?'dark':'outline'} full" data-act="submit-att" ${a.pending?'disabled':''}>${I('checkcircle',17)} ${a.pending?'Mark everyone to submit':submitted?'Resubmit attendance':'Submit attendance'}</button><p class="help" style="text-align:center">${s.type==='software'?'Team attendance is optional for software projects.':'Full / AM / PM / Absent. Half-day conflicts are checked against other sites on this device.'}</p></div>`:''}<div class="section"><button class="btn outline full" data-act="add-worker" data-id="${s.id}">${I('plus',16)} Add worker to this roster</button></div>`}

function renderTasks(){const s=site(route.siteId);if(!s)return renderSites();let ts=siteTasks(s.id);if(route.filter==='today')ts=ts.filter(t=>t.due<=today&&t.status!=='done');else if(route.filter==='open')ts=ts.filter(t=>t.status!=='done');else if(route.filter==='done')ts=ts.filter(t=>t.status==='done');const canEdit=isChecked(s.id);return `<div style="padding-top:17px"><button class="back" data-site="${s.id}">${I('left',16)} ${esc(s.name)}</button></div>${sectionIntro('Project work','Site tasks',s.project)}<div class="between" style="margin-bottom:14px"><div class="pill">${siteTasks(s.id).length} total · ${siteProgress(s.id)}% progress</div><button class="btn dark tiny" data-act="new-task" data-id="${s.id}">${I('plus',14)} New task</button></div><div class="between" style="margin-bottom:12px"><div class="filterbar">${[['today','Today'],['open','Open'],['all','All'],['done','Done']].map(([id,label])=>`<button class="filterchip ${route.filter===id?'on':''}" data-tfilter="${id}">${label}</button>`).join('')}</div><button class="iconbtn" data-act="toggle-board" title="Toggle list / board">${I(route.taskView==='list'?'board':'list',18)}</button></div>${route.taskView==='board'?renderBoard(ts):`<div class="card">${ts.map(renderTaskItem).join('')||empty('No tasks in this view','Try another filter or create a task.','tasks')}</div>`}${!canEdit?`<p class="help">Check in to record progress, photos and completion on this site. You can still view existing tasks.</p>`:''}`}

function renderTaskDetail(){const t=task(route.taskId);if(!t)return renderTasks();const s=site(t.siteId);const on=isChecked(s.id),photos=data.photos.filter(p=>p.taskId===t.id),ev=data.activity.filter(e=>e.taskId===t.id);return `<div style="padding-top:17px"><div class="between"><button class="back" data-nav="tasks" data-sid="${s.id}">${I('left',16)} All tasks</button><span class="small muted">${esc(t.id.toUpperCase().slice(0,10))}</span></div></div><div class="pagehead" style="padding:16px 0 20px"><div class="between" style="margin-bottom:13px"><span class="small muted">${esc(s.project)}</span>${statusPill(t.status)}</div><h1 style="font-size:26px">${esc(t.title)}</h1><div class="row muted small" style="margin-top:13px;gap:13px"><span class="row" style="gap:4px">${I('pin',13)} ${esc(t.location||s.name)}</span><span class="row" style="gap:4px">${I('calendar',13)} ${t.due===today?'Due today':`Due ${esc(t.due)}`}</span></div></div><div class="task-summary"><div class="between"><div><div class="muted small">Work completed</div><div class="big">${t.progress}%</div></div>${t.quantity?`<div style="text-align:right"><div style="font-weight:680;font-size:16px">${Math.round(t.quantity*t.progress/100)} / ${t.quantity}</div><div class="muted small" style="margin-top:3px">${esc(t.unit)} (estimated)</div></div>`:''}</div><div class="progress" style="margin-top:15px"><i style="width:${t.progress}%"></i></div><div class="row small muted" style="margin-top:15px">${I('users',14)} ${esc(t.assignee||'Unassigned')}</div></div><div class="grid2" style="margin-top:14px"><button class="btn dark" data-act="update-task" ${!on||t.status==='done'?'disabled':''}>${I('plus',17)} Add update</button><button class="btn outline" data-act="issue-task" ${!on||t.status==='done'?'disabled':''}>${I('warning',15)} Report issue</button></div>${t.status==='review'?`<button class="btn soft full" style="margin-top:9px" data-act="approve-task">${I('checkcircle',17)} Approve completion</button>`:t.status!=='done'?`<button class="btn outline full" style="margin-top:9px" data-act="complete-task" ${!on?'disabled':''}>${I('checkcircle',16)} Mark task completed</button>`:''}${!on?`<p class="help">Check in to ${esc(s.name)} to edit this task.</p>`:''}<div class="section"><div class="tabs">${[['timeline','Timeline'],['photos',`Photos (${photos.length})`],['details','Details']].map(([id,label])=>`<button class="${route.tab===id?'on':''}" data-tab="${id}">${label}</button>`).join('')}</div>${route.tab==='timeline'?`<div class="between" style="margin-top:20px"><h3>Activity timeline</h3><span class="small muted">Newest first</span></div>${timeline(ev,true)}`:route.tab==='photos'?`<div style="padding-top:20px"><div class="between"><h3>Progress photos</h3><span class="small muted">${photos.length} photos</span></div>${photos.length?`<div class="photo-grid">${photos.map(photoThumb).join('')}</div>`:empty('No photos yet','Add a progress update to capture the first photo.','camera')}</div>`:`<div class="card cardpad" style="margin-top:15px"><div class="stack">${[['Project',s.project],['Site',s.name],['Assignee',t.assignee||'Unassigned'],['Due date',t.due],['Work location',t.location||'General'],['Quantity',t.quantity?`${t.quantity} ${t.unit}`:'Not measured'],['Description',t.description||'—']].map(([key,val])=>`<div class="between" style="align-items:flex-start"><span class="small muted">${key}</span><span class="small" style="text-align:right;max-width:65%">${esc(val)}</span></div>`).join('')}</div></div>`}</div>`}

function timeline(events,withPhotos){if(!events.length)return empty('No activity yet','Updates will appear here.','activity');return `<div class="timeline">${events.map(e=>{const siteName=site(e.siteId)?.name||'General';const ph=data.photos.filter(p=>p.eventId===e.id);return `<div class="event"><div class="event-icon">${I(e.type==='visit'?'pin':e.type==='photo'?'camera':e.type==='note'?'note':e.type==='attendance'?'users':e.type==='issue'?'warning':'check',14)}</div><div class="event-body"><div class="between"><div class="event-title">${esc(e.title)}</div>${e.taskId?`<button class="linkbtn" style="padding:0" data-task="${e.taskId}">${I('chevron',14)}</button>`:''}</div>${!withPhotos?`<div class="small muted" style="margin-top:4px">${esc(siteName)}</div>`:''}${e.text?`<div class="event-description">${esc(e.text)}</div>`:''}${ph.length?`<div class="photo-grid">${ph.map(photoThumb).join('')}</div>`:''}<div class="event-date">${fmtDateTime(e.at)} · ${esc(e.by)}</div></div></div>`}).join('')}</div>`}

function renderNotes(){const scoped=route.siteId&&site(route.siteId);const list=data.notes.filter(n=>scoped?n.siteId===scoped.id:route.noteFilter==='all'||route.noteFilter==='general'&&!n.siteId||route.noteFilter==='site'&&n.siteId).sort((a,b)=>new Date(b.at)-new Date(a.at));return `${scoped?`<div style="padding-top:17px"><button class="back" data-site="${scoped.id}">${I('left',16)} ${esc(scoped.name)}</button></div>`:''}${sectionIntro(scoped?'Project workspace':'Capture a thought',scoped?'Site notes':'Notes',scoped?`Observations for ${scoped.name}`:'Ideas, observations, and quick reminders—all in one place.')}<button class="btn dark full" data-act="new-note">${I('plus',17)} Write a note</button>${!scoped?`<div class="filterbar" style="margin-top:20px">${[['all','All notes'],['general','General'],['site','Site notes']].map(([v,label])=>`<button class="filterchip ${route.noteFilter===v?'on':''}" data-nfilter="${v}">${label}</button>`).join('')}</div>`:''}<div class="section"><div class="card">${list.map(n=>`<button class="note-card" data-act="edit-note" data-id="${n.id}"><div class="between"><h3>${esc(n.title||'Untitled note')}</h3>${I('chevron',14)}</div><p>${esc(n.body)}</p><div class="small muted" style="margin-top:9px">${esc(n.siteId?site(n.siteId)?.name||'Site':'General')} · ${fmtDateTime(n.at)}</div></button>`).join('')||empty('A clear page','Your notes will appear here.','note')}</div></div>`}
function renderSettings(){return `${sectionIntro('Preferences & demo setup','Settings','Manage site locations, rosters and your local prototype data.')}<div class="card settingsblock"><h3>Your profile</h3><div class="formgroup" style="margin-top:13px"><label class="field-label">Display name</label><input id="profile-name" value="${attr(data.user.name)}" /></div><button class="btn dark tiny" data-act="save-profile">Save profile</button></div><section class="section"><div class="sectiontitle"><h2>Site configurations</h2><button class="linkbtn" data-act="new-site">+ Add</button></div><div class="card">${data.sites.map(s=>`<button class="sitecard" data-act="edit-site" data-id="${s.id}"><div class="row"><div class="site-icon">${I(s.geo.enabled?'location':'pin',18)}</div><div class="grow"><div class="sitecard-name">${esc(s.name)}</div><div class="sitecard-sub">${s.geo.enabled?`Geofenced · ${s.geo.radius} m radius`:'No geofence'} · ${s.workers.length} crew</div></div>${I('chevron',17)}</div></button>`).join('')}</div></section><section class="section"><div class="card cardpad"><h3>Demo storage</h3><p class="help">This standalone GitHub Pages version saves records to this browser's local storage and photo database. Data is not shared between phones or a central server.</p><div class="grid2" style="margin-top:15px"><button class="btn outline" data-act="export">${I('download',15)} Export backup</button><button class="btn alert" data-act="reset-data">${I('refresh',15)} Reset demo</button></div></div></section><section class="section"><div class="softpanel"><div class="row">${I('location',18)} <h3>Geofence behaviour</h3></div><p class="help">The app validates check-in against configured coordinates. Automatic checkout runs only while the web app is open and GPS updates are permitted; browsers cannot guarantee background geofence tracking. Server enforcement requires an authenticated backend.</p></div></section>`}
function render(){if(!$('#app'))return;const screens={home:renderHome,sites:renderSites,site:renderSite,attendance:renderAttendance,tasks:renderTasks,task:renderTaskDetail,activity:renderActivity,notes:renderNotes,settings:renderSettings};$('#app').innerHTML=shell((screens[route.page]||renderHome)());drawToast();loadPhotoImages();updateTimers();}
function updateTimers(){$$('.clock-live').forEach(el=>el.textContent=duration(el.dataset.start))}setInterval(updateTimers,1000);
function sheet(title,inner){modal={title};$('#modal-root').innerHTML=`<div class="modal-backdrop" id="sheet-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="${attr(title)}"><div class="handle"></div><div class="sheet-head"><h2>${esc(title)}</h2><button class="sheet-close" data-act="close-modal" aria-label="Close">${I('x',17)}</button></div>${inner}</section></div>`;document.body.classList.add('no-scroll')}
function closeModal(){stopCamera();stagedPhotos.forEach(p=>URL.revokeObjectURL(p.preview));stagedPhotos=[];modal=null;$('#modal-root').innerHTML='';document.body.classList.remove('no-scroll')}
function confirm(title,text,yes,action,id=''){sheet(title,`<p class="subtitle">${esc(text)}</p><div class="actions"><button class="btn outline" data-act="close-modal">Cancel</button><button class="btn ${yes==='Delete'?'alert':'dark'}" data-act="${action}" ${id?`data-id="${id}"`:''}>${esc(yes)}</button></div>`)}
function requirePosition(timeout=15000){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('GPS is unavailable in this browser.'));navigator.geolocation.getCurrentPosition(p=>{livePosition={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,at:Date.now()};resolve(livePosition)},e=>reject(new Error(e.code===1?'Location permission denied. Allow location access in browser settings.':e.code===2?'Location unavailable. Turn on GPS and try again.':'GPS timed out. Move outdoors or retry.')),{enableHighAccuracy:true,timeout,maximumAge:10000})})}
async function checkin(id){const s=site(id);if(!s)return;let pos=null;if(s.geo.enabled){if(!Number.isFinite(Number(s.geo.lat))||!Number.isFinite(Number(s.geo.lng))){toast('Site geofence coordinates are missing. Ask an admin to configure them.');return}sheet('Verifying location',`<p class="subtitle">${I('location',17)} Getting your GPS location for ${esc(s.name)}…</p><p class="help">Location permission is required at geofenced sites.</p>`);try{pos=await requirePosition();const d=distance(pos.lat,pos.lng,Number(s.geo.lat),Number(s.geo.lng));if(pos.accuracy>Math.max(120,s.geo.radius*.75)){sheet('GPS needs better accuracy',`<p class="subtitle">Your accuracy is about ${Math.round(pos.accuracy)} m. The ${s.geo.radius} m site boundary cannot be verified reliably.</p><div class="actions"><button class="btn outline" data-act="close-modal">Close</button><button class="btn dark" data-act="checkin" data-id="${s.id}">Retry GPS</button></div>`);return}if(d>s.geo.radius){sheet('Outside site boundary',`<div class="row">${I('warning',22)}<strong>Check-in not permitted</strong></div><p class="subtitle">You are approximately <b>${Math.round(d)} m</b> from this site's center. The permitted radius is <b>${s.geo.radius} m</b>.</p><p class="help">Check GPS accuracy or ask the administrator to confirm the site's configured center and radius. You cannot bypass the fence here.</p><button class="btn outline full" style="margin-top:17px" data-act="close-modal">OK</button>`);return}}catch(e){sheet('Could not verify location',`<p class="subtitle">${esc(e.message)}</p><div class="actions"><button class="btn outline" data-act="close-modal">Cancel</button><button class="btn dark" data-act="checkin" data-id="${s.id}">Retry</button></div>`);return}}const v=active();if(v&&v.siteId!==id){const previously=site(v.siteId);endVisit(v.id,false,'Switched to another site');}if(v&&v.siteId===id){closeModal();openRoute('site',id);return}data.visits.unshift({id:uid(),siteId:id,checkIn:stamp(),checkOut:null,checkInCoords:pos,checkOutCoords:null,auto:false});event(id,null,'visit','Checked in to site',pos?`GPS checked · ${Math.round(pos.accuracy)} m accuracy`:'Manual check-in');save();closeModal();openRoute('site',id);startWatch();toast('Checked in. Your supervision clock is running.')}
function endVisit(id,auto=false,reason=''){const v=data.visits.find(x=>x.id===id);if(!v||v.checkOut)return;v.checkOut=stamp();v.checkOutCoords=livePosition;v.auto=auto;event(v.siteId,null,'visit',auto?'Auto checkout · outside geofence':'Checked out of site',reason||`Visit duration ${duration(v.checkIn)}`);save();stopWatch()}
function startWatch(){stopWatch();const v=active();if(!v)return;const s=site(v.siteId);if(!s?.geo.enabled||!navigator.geolocation)return;watchId=navigator.geolocation.watchPosition(p=>{const newpos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,at:Date.now()};livePosition=newpos;const vnow=active();if(!vnow||vnow.siteId!==s.id)return;const d=distance(newpos.lat,newpos.lng,s.geo.lat,s.geo.lng);const clearlyOutside=newpos.accuracy<=Math.max(100,s.geo.radius*.6)&&d>s.geo.radius+Math.max(35,newpos.accuracy);if(clearlyOutside){outsideHits++;if(!outsideSince)outsideSince=Date.now();if(outsideHits>=2&&Date.now()-outsideSince>=20000){endVisit(vnow.id,true,`GPS detected ${Math.round(d)} m from site center, beyond ${s.geo.radius} m radius`);openRoute('sites');toast(`Automatically checked out of ${s.name}: outside boundary.`)}}else{outsideSince=null;outsideHits=0}},err=>{if(err.code===1)toast('Location permission changed. Automatic checkout is paused.')},{enableHighAccuracy:true,maximumAge:10000,timeout:20000})}
function stopWatch(){if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);watchId=null;outsideSince=null;outsideHits=0}
function conflict(sid,wid,status){if(status==='absent')return null;const taken=new Set(status==='full'?['am','pm']:[status]);for(const s of data.sites){if(s.id===sid)continue;const mark=attendance(s.id,wid);if(!mark||mark.status==='absent')continue;const other=new Set(mark.status==='full'?['am','pm']:[mark.status]);if([...taken].some(x=>other.has(x)))return {site:s.name,status:mark.status}}return null}
function markAttendance(sid,wid,status,silent=false){if(!isChecked(sid)){if(!silent)toast('Check in to this site before marking attendance.');return false}const c=conflict(sid,wid,status);if(c){if(!silent)toast(`Conflict: already ${statusName[c.status]} at ${c.site}. Edit that mark first.`);return false}const key=attKey(sid,wid);const prev=data.attendance[key];data.attendance[key]={status,remark:prev?.remark||'',updatedAt:stamp(),by:data.user.name};delete data.submissions[dayKey(sid)];event(sid,null,'attendance',`${data.workers.find(w=>w.id===wid)?.name||'Worker'} · ${statusName[status]}`,prev?.status?`Changed from ${statusName[prev.status]}`:'Marked attendance');return true}

// Photos are in IndexedDB so images are not constrained by localStorage's small quota.
function photoDb(){if(photoDbPromise)return photoDbPromise;photoDbPromise=new Promise((resolve,reject)=>{if(!indexedDB)return reject(new Error('IndexedDB unavailable'));const r=indexedDB.open('snap-field-photos-v3',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return photoDbPromise}
async function putImage(id,blob){const db=await photoDb();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function getImage(id){const db=await photoDb();return new Promise((res,rej)=>{const tx=db.transaction('files','readonly'),r=tx.objectStore('files').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

async function imageToBlob(source,meta,sourceType){let iw,ih,draw;let image=null;if(source instanceof HTMLVideoElement){iw=source.videoWidth;ih=source.videoHeight;draw=(ctx,w,h)=>ctx.drawImage(source,0,0,w,h)}else{image=await createImageBitmap(source);iw=image.width;ih=image.height;draw=(ctx,w,h)=>ctx.drawImage(image,0,0,w,h)}if(!iw||!ih)throw Error('Invalid image');let width=Math.min(iw,1400),height=Math.round(ih*width/iw);const footer=83;const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height+footer;const ctx=canvas.getContext('2d');ctx.fillStyle='#f3f5f3';ctx.fillRect(0,0,canvas.width,canvas.height);draw(ctx,width,height);ctx.fillStyle='#18221e';ctx.fillRect(0,height,width,footer);const unit=Math.max(12,Math.round(width/62));ctx.fillStyle='#fff';ctx.font=`600 ${unit+3}px system-ui,-apple-system,sans-serif`;ctx.fillText(`SNAP FIELD  ·  ${meta.siteName}`,17,height+29,width-33);ctx.fillStyle='#cfddd5';ctx.font=`${unit}px system-ui,-apple-system,sans-serif`;const coords=meta.position?`${meta.position.lat.toFixed(5)}, ${meta.position.lng.toFixed(5)}`:'GPS unavailable';ctx.fillText(`${meta.by}  ·  ${fmtDateTime(meta.at)}  ·  ${coords}`,17,height+56,width-33);if(image)image.close();return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(Error('Could not encode image')),'image/jpeg',.82))}

case 'new-task':taskCreateSheet(b.dataset.id);break;case 'save-new-task':{const title=$('#task-title').value.trim();if(!title){toast('Enter a task title.');break}const sid=b.dataset.id,tid=uid();data.tasks.unshift({id:tid,siteId:sid,title,location:$('#task-location').value.trim(),assignee:$('#task-assignee').value.trim(),due:$('#task-due').value||today,progress:0,status:'todo',quantity:null,unit:'',description:$('#task-desc').value.trim()});event(sid,tid,'task','Task created',title);save();closeModal();openRoute('task',sid,tid);toast('Task created');break}case 'toggle-board':route.taskView=route.taskView==='list'?'board':'list';render();break;case 'update-task':updateTaskSheet(false);break;case 'issue-task':updateTaskSheet(true);break;case 'save-task-update':await saveTaskUpdate(b.dataset.kind);break;case 'complete-task':completeTaskSheet();break;case 'finish-task':await finishTask();break;case 'approve-task':{const t=task(route.taskId);t.status='done';event(t.siteId,t.id,'progress','Task approved and completed','Completion reviewed.');save();render();toast('Task approved');break}case 'open-camera':await openCamera();break;case 'choose-photos':$('#galleryUpload').click();break;case 'native-camera':closeCameraLayer();$('#nativeCamera').click();break;case 'close-camera':closeCameraLayer();break;case 'capture-camera':await captureCamera();break;case 'remove-staged':{const i=Number(b.dataset.index);URL.revokeObjectURL(stagedPhotos[i].preview);stagedPhotos.splice(i,1);updateStagedList();break}case 'view-photo':{const p=data.photos.find(x=>x.id===b.dataset.id);if(p)photoSheet(p);break}case 'new-note':noteSheet();break;case 'edit-note':noteSheet(b.dataset.id);break;case 'save-note':{const title=$('#note-title').value.trim(),body=$('#note-body').value.trim(),sid=$('#note-site').value||null;if(!title&&!body){toast('Write a title or some content.');break}const old=data.notes.find(n=>n.id===b.dataset.id);if(old){Object.assign(old,{title,body,siteId:sid,at:stamp()})}else data.notes.unshift({id:uid(),title,body,siteId:sid,at:stamp(),by:data.user.name});event(sid,null,'note',old?'Note updated':'Note added',title||body.slice(0,60));save();closeModal();render();toast('Note saved');break}case 'delete-note':{data.notes=data.notes.filter(n=>n.id!==b.dataset.id);save();closeModal();render();toast('Note deleted');break}case 'add-worker':workerSheet(b.dataset.id);break;case 'save-new-worker':{const name=$('#new-worker-name').value.trim(),role=$('#new-worker-role').value.trim()||'Crew member';if(!name){toast('Enter worker name.');break}let w=data.workers.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!w){w={id:uid(),name,role};data.workers.push(w)}const s=site(b.dataset.id);if(!s.workers.includes(w.id))s.workers.push(w.id);save();closeModal();render();toast('Worker added to the site roster');break}case 'new-site':siteSheet();break;case 'edit-site':siteSheet(b.dataset.id);break;case 'geo-toggle':b.classList.toggle('on');b.setAttribute('aria-pressed',String(b.classList.contains('on')));$('#geo-fields').style.display=b.classList.contains('on')?'block':'none';break;case 'review-toggle':b.classList.toggle('on');b.setAttribute('aria-pressed',String(b.classList.contains('on')));break;case 'use-my-gps':{b.disabled=true;try{const p=await requirePosition();$('#geo-lat').value=p.lat.toFixed(7);$('#geo-lng').value=p.lng.toFixed(7);toast(`Location captured · ±${Math.round(p.accuracy)} m`)}catch(err){toast(err.message)}b.disabled=false;break}case 'save-site':{const name=$('#site-name').value.trim();if(!name){toast('Site name is required.');break}const enabled=$('#geo-toggle').classList.contains('on'),lat=Number($('#geo-lat')?.value),lng=Number($('#geo-lng')?.value),radius=Number($('#geo-radius')?.value)||200;if(enabled&&(!$('#geo-lat').value||!$('#geo-lng').value||!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)){toast('Enter a valid GPS latitude and longitude.');break}if(enabled&&(radius<30||radius>10000)){toast('Geofence radius must be 30–10,000 meters.');break}const old=site(b.dataset.id),geo={enabled,lat:enabled?lat:null,lng:enabled?lng:null,radius},patch={name,project:$('#site-project').value.trim()||'General project',address:$('#site-address').value.trim()||'Location not provided',type:$('#site-type').value,geo,review:$('#review-toggle').classList.contains('on')};if(old){Object.assign(old,patch)}else data.sites.push({id:uid(),...patch,workers:[]});save();closeModal();render();toast('Site settings saved on this device');if(active())startWatch();break}case 'save-profile':{const name=$('#profile-name').value.trim();if(!name){toast('Name cannot be empty.');break}data.user.name=name;data.user.short=initials(name);save();render();toast('Profile updated');break}case 'export':await exportBackup();break;case 'reset-data':confirm('Reset demo data?','This deletes locally saved site visits, attendance, notes and task changes on this browser. Export a backup first.','Delete','do-reset');break;case 'do-reset':{stopWatch();const old=data.photos.slice();data=seed();save();for(const p of old){try{const db=await photoDb();db.transaction('files','readwrite').objectStore('files').delete(p.id)}catch{}}route={page:'home',siteId:null,taskId:null,tab:'timeline',filter:'all',attFilter:'all',projectQuery:'',taskView:'list',noteFilter:'all'};closeModal();render();toast('Demo data reset');break}default:break}
});
document.addEventListener('input',e=>{if(e.target.id==='update-percent'){$('#progress-value').textContent=`${e.target.value}%`;$$('[data-pct]').forEach(b=>b.classList.toggle('on',b.dataset.pct===e.target.value))}if(e.target.id==='ghost-opacity'&&$('#ghost-photo'))$('#ghost-photo').style.opacity=Number(e.target.value)/100;if(e.target.dataset.search==='sites'){route.projectQuery=e.target.value;const pos=e.target.selectionStart;const results=data.sites.filter(s=>`${s.name} ${s.project} ${s.address}`.toLowerCase().includes(route.projectQuery.toLowerCase()));const box=$('#site-results');if(box)box.innerHTML=results.map(siteListItem).join('')||empty('No matching sites','Try another search.');e.target.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='select-all-workers'){$$('.select-worker').forEach(i=>i.checked=e.target.checked)}if(e.target.classList.contains('select-worker')||e.target.id==='select-all-workers'){const c=$('#selected-count');if(c)c.textContent=`${$$('.select-worker:checked').length} selected`}if(e.target.id==='ghost-toggle'&&$('#ghost-photo'))$('#ghost-photo').style.display=e.target.checked?'block':'none'});

if(active())startWatch();render();
