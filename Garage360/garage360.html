<script>
'use strict';
const I=(name,cl='')=>`<svg class="ico ${cl}" aria-hidden="true"><use href="#ico-${name}"></use></svg>`;
const fmtNum=x=>new Intl.NumberFormat('en-AE',{maximumFractionDigits:0}).format(Math.round(x));
const money=x=>'AED '+fmtNum(x);
const pad=n=>String(n).padStart(2,'0');
function uaedate(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>parts.find(p=>p.type===t).value;return `${get('year')}-${get('month')}-${get('day')}`}
const TODAY=uaedate();
const utc=d=>new Date(d+'T12:00:00Z');
const iso=d=>new Date(d).toISOString().slice(0,10);
const add=(d,n)=>iso(utc(d).getTime()+n*86400000);
const age=(start,end=TODAY)=>Math.floor((utc(end)-utc(start))/86400000);
const nice=(d,opt)=>new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',day:'numeric',month:'short',...(opt==='year'?{year:'numeric'}:{})}).format(utc(d));
const longdate=d=>new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(utc(d));
const inrange=(d)=>!!d&&d>=period.from&&d<=period.to;
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
const dateRangeText=()=>period.from===period.to?longdate(period.from):nice(period.from,'year')+' – '+nice(period.to,'year');
const LS_THEME='g360-dashboard-global-theme-v1',LS_LAYOUT='g360-role-dashboard-v5-layout',LS_ROLE='g360-role-dashboard-v5-role',LS_ACTIONS='g360-mobile-actions-v1-'+TODAY;
const read=(k,fall)=>{try{return JSON.parse(localStorage.getItem(k))??fall}catch{return fall}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const THEMES=[['default','Default','#30485e'],['green','Green','#2ebc60'],['blue','Blue','#3b82f6'],['purple','Purple','#a855f7'],['orange','Orange','#f97316']];
const ROLES={owner:'Garage owner',advisor:'Service advisor',accounts:'Accounts',other:'Other role'};
const METRICS={vehicle:['Vehicle In','car','Visits created'],estimated:['Estimated','estimate','Estimates created'],active:['Active job cards','job','Open jobs created'],invoiced:['Invoiced','invoice','Invoices issued'],invoicedAmt:['Invoiced amount','wallet','Including VAT'],collected:['Payments collected','wallet','Against selected invoices'],pendingAmt:['Pending amount','clock','Against selected invoices']};
const QUEUES={invoicePending:['Invoice pending','invoice','Awaiting invoice','blue'],estimatePending:['Estimate pending','estimate','Awaiting job cards','amber'],qcPending:['QC pending','shield','Awaiting quality check','amber'],overdue:['Overdue payment','warning','Past the payment due date','red']};
const DEFAULT={owner:{metrics:['vehicle','invoiced','invoicedAmt'],attention:['invoicePending','estimatePending','overdue'],chart:true,recent:true},advisor:{metrics:['vehicle','estimated','active'],attention:['invoicePending','estimatePending','qcPending'],chart:false,recent:true},accounts:{metrics:['invoiced','invoicedAmt','collected','pendingAmt'],attention:['invoicePending','estimatePending','overdue'],chart:true,recent:true},other:{metrics:['vehicle','estimated','active'],attention:['invoicePending','estimatePending','qcPending'],chart:false,recent:true}};
const ALLOWED={owner:{metrics:['vehicle','invoiced','invoicedAmt'],attention:['invoicePending','estimatePending','overdue'],chart:true},advisor:{metrics:['vehicle','estimated','active'],attention:['invoicePending','estimatePending','qcPending'],chart:false},accounts:{metrics:['invoiced','invoicedAmt','collected','pendingAmt'],attention:['invoicePending','estimatePending','overdue'],chart:true},other:{metrics:['vehicle','estimated','active'],attention:['invoicePending','estimatePending','qcPending'],chart:false}};
let role=read(LS_ROLE,'owner');if(!ROLES[role])role='owner';let theme=read(LS_THEME,'default');if(!THEMES.some(t=>t[0]===theme))theme='default';document.documentElement.dataset.theme=theme;
let layouts=read(LS_LAYOUT,{});let patches=read(LS_ACTIONS,{});let page='home';let period={key:'today',from:TODAY,to:TODAY},currentSheet='',sheetParams={},sheetQuery='',agingFilter='all',activityFilter='all',detailsId=null;
function presets(){const y=+TODAY.slice(0,4),m=+TODAY.slice(5,7);const dow=(utc(TODAY).getUTCDay()+6)%7;const first=`${y}-${pad(m)}-01`;const last=add(`${y}-${pad(m+1>12?1:m+1)}-01`,-1);const prevM=iso(new Date(Date.UTC(y,m-2,1)));const prevEnd=add(first,-1);const yr=`${y}-01-01`;return[
['today','Today',TODAY,TODAY],['yesterday','Yesterday',add(TODAY,-1),add(TODAY,-1)],['thisWeek','This week',add(TODAY,-dow),add(TODAY,6-dow)],['prevWeek','Previous week',add(TODAY,-dow-7),add(TODAY,-dow-1)],['thisMonth','This month',first,iso(new Date(Date.UTC(y,m,0)))],['prevMonth','Previous month',prevM,prevEnd],['thisYear','This year',yr,`${y}-12-31`],['prevYear','Previous year',`${y-1}-01-01`,`${y-1}-12-31`]]}
const pset=presets();
function setPeriod(key,from,to){period={key,from,to};render();closeSheet();toast('Reporting period updated')}
function cfg(){const d=DEFAULT[role],a=ALLOWED[role],raw=layouts[role]||d;const clean=(list,scope)=>[...new Set((Array.isArray(list)?list:[]).filter(k=>scope.includes(k)))];return{metrics:clean(raw.metrics,a.metrics),attention:clean(raw.attention,a.attention),chart:!!a.chart&&raw.chart!==false,recent:raw.recent!==false}}
function updateCfg(c){layouts[role]=c;save(LS_LAYOUT,layouts);render()}
const finance=()=>role==='owner'||role==='accounts';
let seed=1804551;const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};const pick=ls=>ls[Math.floor(random()*ls.length)];
const PEOPLE=['Ameer Ali','Fatima N.','Mohammed R.','Sara Ahmed','Nikhil S.','Yousef M.','Arjun K.','Bilal K.','Nadia A.','Rashid S.','Joseph Thomas','Leena P.','Faisal R.','Aisha K.','Rohan P.','Hassan M.'];
const CARS=['Toyota Camry','Toyota Corolla','Nissan Patrol','Honda Civic','Hyundai Tucson','Lexus ES 350','Kia Sportage','BMW 320i','Ford Explorer'];
const SERVICES=['Periodic service','AC repair','Engine diagnostics','Brake replacement','Electrical checks','Suspension repair'];
const VISITS=[];let idn=0;
const SAMPLE_START=String(Number(TODAY.slice(0,4))-1)+'-01-01';
for(let offset=age(SAMPLE_START,TODAY);offset>=0;offset--){let d=add(TODAY,-offset),count=offset===0?37:3+Math.floor(random()*10);for(let j=0;j<count;j++){
 const id=++idn,estimateAt=random()<.94?add(d,pick([0,0,0,1,2])):null,jobAt=estimateAt&&random()<.93?add(estimateAt,pick([0,0,1,2,3])):null,workDoneAt=jobAt&&random()<.95?add(jobAt,pick([0,1,1,2,3,4])):null,qcAt=workDoneAt&&random()<.95?add(workDoneAt,pick([0,0,1,2])):null,invoiceAt=qcAt&&random()<.97?add(qcAt,pick([0,0,1,1,2])):null;
 const total=5*Math.round((480+random()*5600)/5),dueAt=invoiceAt?add(invoiceAt,pick([7,14,14,21,30])):null;
 let payments=[];if(invoiceAt){let z=random();if(z<.70)payments=[{at:add(invoiceAt,pick([0,0,1,3,8,14,23])),amount:total}];else if(z<.83)payments=[{at:add(invoiceAt,pick([0,1,4,10])),amount:Math.round(total*pick([.3,.5,.7]))}];}
 // Keep some unbilled work as open queues; old visits can have explicitly closed work.
 if(invoiceAt&&age(invoiceAt)>45&&random()<.91){const gotten=payments.filter(p=>p.at<=TODAY).reduce((s,p)=>s+p.amount,0);if(gotten<total)payments.push({at:add(invoiceAt,pick([20,27,34,40])),amount:total-gotten})}
 const closedAt=offset>45&&!invoiceAt&&random()<.88?add(d,pick([6,9,12,16])):null;
 VISITS.push({id:'VIS-'+String(id).padStart(5,'0'),customer:pick(PEOPLE),vehicle:pick(CARS),plate:pick(['D','A','S','B'])+' '+Math.floor(10000+random()*80000),service:pick(SERVICES),createdAt:d,estimateAt,jobAt,workDoneAt,qcAt,invoiceAt,total,dueAt,payments,closedAt,estimateRef:'EST-'+String(id).padStart(5,'0'),jobRef:'JC-'+String(id).padStart(5,'0'),invoiceRef:'INV-'+String(id).padStart(5,'0'),createdTime:`${pad(8+Math.floor(random()*10))}:${pick(['00','15','30','45'])}`,invoiceTime:`${pad(8+Math.floor(random()*10))}:${pick(['00','15','30','45'])}`});
}}
const ids=new Map(VISITS.map(v=>[v.id,v]));
const record=r=>({...r,...(patches[r.id]||{}),payments:patches[r.id]?.payments??r.payments});
const all=()=>VISITS.map(record);
const invoiced=r=>!!r.invoiceAt&&r.invoiceAt<=TODAY;
const paid=r=>invoiced(r)?Math.min(r.total,r.payments.filter(p=>p.at<=TODAY).reduce((sum,p)=>sum+p.amount,0)):0;
const pending=r=>invoiced(r)?Math.max(0,r.total-paid(r)):0;
function status(r){if(r.closedAt&&r.closedAt<=TODAY&&!invoiced(r))return'Closed';if(invoiced(r))return pending(r)<=0?'Paid':r.dueAt<TODAY?'Overdue payment':'Payment pending';if(r.qcAt&&r.qcAt<=TODAY)return'Invoice Pending';if(r.workDoneAt&&r.workDoneAt<=TODAY)return'QC Pending';if(r.jobAt&&r.jobAt<=TODAY)return'Job Active';if(r.estimateAt&&r.estimateAt<=TODAY)return'Estimate Pending';return'Vehicle In'}
function ageinfo(r,mode){const start=mode==='invoicePending'?(r.qcAt||r.workDoneAt||r.createdAt):(r.dueAt||r.invoiceAt);if(!start)return null;const days=age(start);return{days:Math.max(days,0),raw:days,anchor:start,text:mode==='invoicePending'?`${Math.max(days,0)} days pending`:days>0?`${days} days overdue`:days===0?'Due today':`Due in ${-days} days`}}
function bucket(r,mode){let a=ageinfo(r,mode);if(!a)return'all';if(mode!=='invoicePending'&&a.raw<=0)return'notDue';return a.days<=7?'0-7':a.days<=15?'8-15':a.days<=30?'16-30':a.days<=60?'31-60':'61+'}
function rowsFor(mode){const rows=all();switch(mode){case'vehicle':return rows.filter(r=>inrange(r.createdAt));case'estimated':return rows.filter(r=>inrange(r.estimateAt));case'active':return rows.filter(r=>inrange(r.jobAt)&&status(r)==='Job Active');case'invoiced':case'invoicedAmt':case'collected':case'pendingAmt':return rows.filter(r=>inrange(r.invoiceAt)&&invoiced(r));case'invoicePending':return rows.filter(r=>status(r)==='Invoice Pending');case'estimatePending':return rows.filter(r=>status(r)==='Estimate Pending');case'qcPending':return rows.filter(r=>status(r)==='QC Pending');case'overdue':return rows.filter(r=>status(r)==='Overdue payment');default:return []}}
function stat(mode){const rows=rowsFor(mode);switch(mode){case'invoicedAmt':return rows.reduce((s,r)=>s+r.total,0);case'collected':return rows.reduce((s,r)=>s+paid(r),0);case'pendingAmt':case'overdue':return rows.reduce((s,r)=>s+pending(r),0);default:return rows.length}}
const isMoney=k=>['invoicedAmt','collected','pendingAmt','overdue'].includes(k);
function chartBins(){const n=age(period.from,period.to)+1,bins=[];if(n===1){for(let i=8;i<=18;i+=2)bins.push({label:pad(i)+':00',from:period.from,to:period.to,hour:i,items:[]})}
else if(n<=8){for(let d=period.from;d<=period.to;d=add(d,1))bins.push({label:nice(d),from:d,to:d,items:[]})}
else if(n<=65){for(let d=period.from;d<=period.to;d=add(d,7)){const last=add(d,6)>period.to?period.to:add(d,6);bins.push({label:nice(d),from:d,to:last,items:[]})}}
else{let d=period.from;while(d<=period.to){let [y,m]=d.split('-').map(Number);let end=iso(new Date(Date.UTC(y,m,0)));if(end>period.to)end=period.to;bins.push({label:new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',month:'short',year:n>370?'2-digit':undefined}).format(utc(d)),from:d,to:end,items:[]});d=add(end,1)}}
const maxBuckets=16;if(bins.length>maxBuckets){const grouped=[];for(let i=0;i<bins.length;i+=3){const chunk=bins.slice(i,i+3);grouped.push({label:chunk[0].label,from:chunk[0].from,to:chunk.at(-1).to,items:[]})}bins.length=0;bins.push(...grouped)}
for(const r of rowsFor('invoiced')){const ix=bins.findIndex(b=>r.invoiceAt>=b.from&&r.invoiceAt<=b.to&&(n!==1||b.hour===clamp(8+2*Math.floor((Number(r.invoiceTime?.slice(0,2)||'8')-8)/2),8,18)));if(ix>=0)bins[ix].items.push(r)}
return bins.map((b,i)=>({...b,index:i,pending:b.items.reduce((s,r)=>s+pending(r),0),collected:b.items.reduce((s,r)=>s+paid(r),0)}))}
function iconMetric(k){return METRICS[k][1]}
function makeMetric(k){const [name,ico,note]=METRICS[k];const value=stat(k);return `<button class="metric" data-action="metric" data-mode="${k}"><span class="metric-header"><span class="metric-name">${name}</span><span class="metric-icon">${I(ico)}</span></span><span class="metric-amount ${isMoney(k)?'money':''}">${isMoney(k)?money(value):fmtNum(value)}</span><span class="metric-foot"><span>${note}</span>${I('chevron-right','small')}</span></button>`}
function makeQueue(k){const [name,ico,help,c]=QUEUES[k];return `<button class="queue-row" data-action="queue" data-mode="${k}"><span class="q-icon ${c}">${I(ico)}</span><span class="q-txt"><strong>${name}</strong><small>${help}</small></span><span class="q-val ${isMoney(k)?'money':''}">${isMoney(k)?money(stat(k)):fmtNum(stat(k))}</span>${I('chevron-right','small')}</button>`}
function chart(){const bins=chartBins(),pend=stat('pendingAmt'),coll=stat('collected'),max=Math.max(1,...bins.map(b=>Math.max(b.pending,b.collected)));return `<section class="panel" id="billing"><div class="panel-head"><div><h2>Billing &amp; collections</h2><p>For invoices dated in the selected period</p></div>${I('chart')}</div><div class="range-band">${I('calendar')}<div><small>INVOICE DATE · UAE (GST)</small><strong>${dateRangeText()}</strong></div></div><div class="money-split"><div><small>Pending amount</small><strong>${money(pend)}</strong></div><div><small>Collected amount</small><strong class="positive">${money(coll)}</strong></div></div><div class="chart-head"><b>Invoice payment status</b><span class="chart-legend"><span><i></i>Pending</span><span class="col"><i></i>Collected</span></span></div><div class="chart-area">${bins.map(b=>`<button class="chart-group" data-action="bar" data-bin="${b.index}" aria-label="${b.label}, pending ${money(b.pending)}, collected ${money(b.collected)}" title="${b.label} · Pending ${money(b.pending)} · Collected ${money(b.collected)}"><span class="pending" style="height:${b.pending?Math.max(2,b.pending/max*100):0}%"></span><span class="collected" style="height:${b.collected?Math.max(2,b.collected/max*100):0}%"></span></button>`).join('')}</div><div class="chart-labels">${bins.map(b=>`<span>${b.label}</span>`).join('')}</div><div class="recon"><span>Total invoiced in period</span><strong>${money(pend+coll)}</strong></div><div class="chart-foot"><span>Tap a bar for matching invoices</span><button class="view-link" data-action="metric" data-mode="invoiced">View invoices →</button></div></section>`}
function recentItems(limit=6){let things=[];for(const r of all()){
 if(inrange(r.createdAt))things.push({dt:r.createdAt,time:r.createdTime,mode:'vehicle',r,headline:'Vehicle checked in',ico:'car'});
 if(inrange(r.jobAt)&&role!=='accounts')things.push({dt:r.jobAt,time:'11:30',mode:'active',r,headline:'Job card created',ico:'job'});
 if(inrange(r.invoiceAt)&&invoiced(r)&&finance())things.push({dt:r.invoiceAt,time:r.invoiceTime,mode:'invoiced',r,headline:'Invoice issued',ico:'invoice'});
 if(inrange(r.estimateAt)&&role!=='accounts')things.push({dt:r.estimateAt,time:'10:15',mode:'estimated',r,headline:'Estimate prepared',ico:'estimate'});
 }if(role==='accounts')things=things.filter(x=>x.mode==='invoiced');return things.sort((a,b)=>b.dt.localeCompare(a.dt)||b.time.localeCompare(a.time)).slice(0,limit)}
function recentList(limit=5){const a=recentItems(limit);if(!a.length)return'<p class="placeholder-empty">No activity for the selected dates.</p>';return a.map(x=>`<button class="recent-row" data-action="detail" data-id="${x.r.id}" data-parent="recent"><span class="recent-icon">${I(x.ico)}</span><span class="recent-text"><strong>${x.headline}</strong><small>${x.r.plate} · ${x.r.customer} · ${nice(x.dt)}</small></span>${finance()&&x.mode==='invoiced'?`<span class="recent-money">${money(x.r.total)}<small>${x.time}</small></span>`:''}${I('chevron-right','small')}</button>`).join('')}
function hero(){return `<div class="hello">Workshop overview</div><div class="heading-line"><h1 class="screen-title">Dashboard</h1><button class="role-pill" data-action="roles">${ROLES[role]} ${I('chevron-down','small')}</button></div><p class="subheading">Your workshop, at a glance.</p>`}
function periodControl(){return `<button class="period-card" data-action="dates"><span class="period-icon">${I('calendar')}</span><span class="period-content"><strong>${pset.find(p=>p[0]===period.key)?.[1]||'Custom range'} · ${dateRangeText()}</strong><small>${age(period.from,period.to)+1} calendar day${age(period.from,period.to)===0?'':'s'} · UAE workshop time</small></span><span class="period-arrow">${I('chevron-right')}</span></button>`}
function home(){const c=cfg();return `${hero()}${periodControl()}${c.metrics.length?`<div class="sec-head"><h2>Activity in selected period</h2><span class="sub">Tap for details</span></div><div class="summary-grid">${c.metrics.map(makeMetric).join('')}</div>`:''}${c.attention.length?`<section class="panel"><div class="panel-head"><div><h2>Needs attention <span class="live">Live</span></h2><p>Current outstanding items · date filter does not apply</p></div>${I('list')}</div>${c.attention.map(makeQueue).join('')}</section>`:''}${c.chart?chart():''}${c.recent?`<section class="panel"><div class="panel-head"><div><h2>Recent activity</h2><p>Within selected dates</p></div><button class="view-link" style="border:0;background:none;color:var(--accent);font-weight:770;font-size:11px" data-action="page" data-page="activity">View all →</button></div>${recentList(5)}</section>`:''}<div class="sheet-note" style="text-align:center;margin:19px 0 0">Demo records · UAE dates · ${longdate(TODAY)}</div>`}
function activityScreen(){return `${hero()}${periodControl()}<div class="sec-head"><h2>Activity timeline</h2><span class="sub">${dateRangeText()}</span></div><div class="panel">${recentList(25)}</div>`}
function insightsScreen(){if(finance()){return `${hero()}${periodControl()}${chart()}<section class="panel"><div class="panel-head"><div><h2>Invoice breakdown</h2><p>Same invoice-date filter</p></div>${I('wallet')}</div>${[['invoicedAmt','Invoiced amount'],['collected','Collected amount'],['pendingAmt','Pending amount']].map(([k,n])=>`<button class="queue-row" data-action="metric" data-mode="${k}"><span class="q-txt"><strong>${n}</strong><small>Tap to view invoices</small></span><span class="q-val money">${money(stat(k))}</span>${I('chevron-right','small')}</button>`).join('')}</section>`}
 return `${hero()}${periodControl()}<section class="panel"><div class="panel-head"><div><h2>Workshop workload</h2><p>Current operational statuses</p></div>${I('activity')}</div>${[['estimatePending','Estimate pending'],['qcPending','QC pending'],['invoicePending','Invoice pending']].map(([k,n])=>`<button class="queue-row" data-action="queue" data-mode="${k}"><span class="q-txt"><strong>${n}</strong><small>Tap to review records</small></span><span class="q-val">${fmtNum(stat(k))}</span>${I('chevron-right','small')}</button>`).join('')}</section>`}
function settingsScreen(){return `${hero()}<section class="panel"><div class="panel-head"><div><h2>Preferences</h2><p>One theme, role-specific widget layouts</p></div>${I('sliders')}</div><button class="queue-row" data-action="customize"><span class="q-icon">${I('sliders')}</span><span class="q-txt"><strong>Customize dashboard</strong><small>Theme · widgets · display order</small></span>${I('chevron-right')}</button><button class="queue-row" data-action="roles"><span class="q-icon">${I('person')}</span><span class="q-txt"><strong>Preview role</strong><small>${ROLES[role]}</small></span>${I('chevron-right')}</button><button class="queue-row" data-action="reset"><span class="q-icon">${I('refresh')}</span><span class="q-txt"><strong>Reset sample records</strong><small>Clears only demo actions</small></span>${I('chevron-right')}</button></section><p class="sheet-note">This functional prototype runs entirely on your phone/browser. In production, logged-in roles and financial API permissions must come from Garage360 backend.</p>`}
function render(){document.getElementById('appMain').innerHTML=page==='home'?home():page==='activity'?activityScreen():page==='insights'?insightsScreen():settingsScreen();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}
function openSheet(kind,title,subtitle,content){currentSheet=kind;document.getElementById('sheetHeading').textContent=title;document.getElementById('sheetSubtitle').textContent=subtitle;document.getElementById('sheetBody').innerHTML=content;document.getElementById('backdrop').classList.add('open');document.getElementById('sheet').classList.add('open');document.body.style.overflow='hidden';document.getElementById('sheetBody').scrollTop=0}
function closeSheet(){document.getElementById('backdrop').classList.remove('open');document.getElementById('sheet').classList.remove('open');document.body.style.overflow='';currentSheet=''}
function dateSheet(){const body=`<p class="sheet-note">Choose a period. The exact included dates are shown under every option.</p><div class="preset-list">${pset.map(p=>`<button class="preset-btn ${period.key===p[0]?'selected':''}" data-action="chooseDate" data-key="${p[0]}"><strong>${p[1]}</strong><small>${p[2]===p[3]?nice(p[2],'year'):nice(p[2])+' – '+nice(p[3],'year')}</small></button>`).join('')}</div><h4>Custom date / range</h4><div class="date-inputs"><div class="field"><label for="dateStart">From</label><input id="dateStart" type="date" value="${period.from}"></div><div class="field"><label for="dateEnd">To</label><input id="dateEnd" type="date" value="${period.to}"></div></div><button class="primary" data-action="applyCustom" style="width:100%">Apply custom dates</button><p id="dateError" style="font-size:11px;color:#bb5555"></p>`;openSheet('date','Reporting period','Both dates inclusive · UAE (GST)',body)}
function rolesSheet(){openSheet('roles','Preview role','Role permissions restrict available widgets',Object.keys(ROLES).map(r=>`<button data-action="selectRole" data-role="${r}" class="role-option ${role===r?'selected':''}"><span class="ro-ico">${I(r==='accounts'?'wallet':r==='owner'?'garage':'person')}</span><strong>${ROLES[r]}</strong>${role===r?I('check'):I('chevron-right')}</button>`).join('')+'<p class="sheet-note">Preview switching is demo-only. In production, roles must be assigned at login.</p>')}
function checkboxRow(section,k,label,enabled,index){const c=cfg();return `<div class="prefs-row"><input type="checkbox" aria-label="Show ${label}" data-action="toggleWidget" data-section="${section}" data-key="${k}" ${enabled?'checked':''}><span class="label">${label}</span>${section==='metrics'?`<button class="mini-ctl" data-action="moveWidget" data-dir="-1" data-key="${k}" title="Move up">${I('arrow-up')}</button><button class="mini-ctl" data-action="moveWidget" data-dir="1" data-key="${k}" title="Move down">${I('arrow-down')}</button>`:''}</div>`}
function customize(){const c=cfg(),allowed=ALLOWED[role];const themes=`<div class="theme-choices">${THEMES.map(([id,name,color])=>`<button class="theme-btn ${theme===id?'selected':''}" data-action="theme" data-theme="${id}" aria-label="Theme ${name}"><span class="theme-ring"><span class="theme-swatch" style="background:${color}"></span></span>${name}</button>`).join('')}</div>`;
const order=[...c.metrics,...allowed.metrics.filter(k=>!c.metrics.includes(k))];const body=`<h4 style="margin-top:2px">Theme color</h4><p class="sheet-note">Common across all roles. Charts keep their Pending/Collected colors.</p>${themes}<div class="small-divider"></div><h4>Activity widgets · ${ROLES[role]}</h4>${order.map((k,i)=>checkboxRow('metrics',k,METRICS[k][0],c.metrics.includes(k),i)).join('')}<h4>Needs attention widgets</h4>${allowed.attention.map((k,i)=>checkboxRow('attention',k,QUEUES[k][0],c.attention.includes(k),i)).join('')}<h4>Sections</h4>${allowed.chart?checkboxRow('misc','chart','Billing & collections',c.chart):''}${checkboxRow('misc','recent','Recent activity',c.recent)}<div class="sheet-actions"><button class="secondary" data-action="restore">Restore defaults</button><button class="primary" data-action="done">Done</button></div><p class="prefs-explain">Only widgets allowed for ${ROLES[role]} are available. Saving is browser-local in this prototype.</p>`;
openSheet('customize','Customize','Theme and role-specific widgets',body)}
function modeAllowed(mode){return (METRICS[mode]?ALLOWED[role].metrics.includes(mode):QUEUES[mode]?ALLOWED[role].attention.includes(mode):false)|| (mode==='invoiced'&&finance())}
function displayTitle(mode){return METRICS[mode]?.[0]||QUEUES[mode]?.[0]||'Invoices'}
const AGE_BANDS=[['all','All'],['0-7','0–7d'],['8-15','8–15d'],['16-30','16–30d'],['31-60','31–60d'],['61+','61+d'],['notDue','Not due']];
function ageMode(mode){return mode==='invoicePending'||mode==='overdue'||mode==='pendingAmt'}
function drill(mode,binIndex=null){if(!modeAllowed(mode)){toast('This information is not available for this role');return}sheetParams={mode,binIndex};sheetQuery='';agingFilter='all';paintDrill()}
function sortedDrillRows(){const {mode,binIndex}=sheetParams;let rows=rowsFor(mode);if(binIndex!==null&&binIndex!==undefined){const b=chartBins()[binIndex];if(b)rows=rows.filter(r=>b.items.some(t=>t.id===r.id))}
if(agingFilter!=='all'&&ageMode(mode))rows=rows.filter(r=>bucket(r,mode)===agingFilter);
if(sheetQuery)rows=rows.filter(r=>[r.id,r.customer,r.vehicle,r.plate,r.invoiceRef,r.jobRef].some(s=>String(s||'').toLowerCase().includes(sheetQuery.toLowerCase())));
return rows.sort((a,b)=>ageMode(mode)?(ageinfo(b,mode)?.days||0)-(ageinfo(a,mode)?.days||0):(b.invoiceAt||b.jobAt||b.createdAt).localeCompare(a.invoiceAt||a.jobAt||a.createdAt))}
function lineValue(r,mode){if(!finance())return'';if(mode==='pendingAmt'||mode==='overdue')return money(pending(r));if(mode==='collected')return money(paid(r));if(mode==='invoicedAmt'||mode==='invoiced')return money(r.total);return''}
function paintDrill(){let {mode,binIndex}=sheetParams;const n=rowsFor(mode).length;const sub=QUEUES[mode]?`Live outstanding · ${longdate(TODAY)}`:dateRangeText()+' · invoice/record date';const ageLabels=ageMode(mode)?`<div class="chiprow">${AGE_BANDS.filter(a=>a[0]!=='notDue'||mode==='pendingAmt').map(([key,label])=>`<button class="chip ${agingFilter===key?'selected':''}" data-action="ageFilter" data-filter="${key}">${label}</button>`).join('')}</div>`:'';
let rows=sortedDrillRows();let total=isMoney(mode)?rows.reduce((s,r)=>s+(mode==='pendingAmt'||mode==='overdue'?pending(r):mode==='collected'?paid(r):r.total),0):rows.length;
const body=`<div class="search-field">${I('search')}<input id="drillSearch" type="search" placeholder="Search plate, customer, reference" value="${escapeAttr(sheetQuery)}" autocomplete="off"></div>${ageLabels}<div class="results-head"><span>${fmtNum(rows.length)} records ${isMoney(mode)?' · '+money(total):''}</span><button class="secondary" style="min-height:31px;padding:6px 9px" data-action="exportCsv">${I('download','small')} CSV</button></div><div id="drillResults">${makeResults(rows,mode)}</div>`;openSheet('drill',displayTitle(mode),sub,body)}
function escapeAttr(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}
function makeResults(rows,mode){return rows.slice(0,80).map(r=>{const info=ageMode(mode)?ageinfo(r,mode):null;return `<button class="list-item" data-action="detail" data-id="${r.id}" data-parent="drill"><span class="recent-icon">${I(mode==='overdue'?'warning':mode==='vehicle'?'car':'invoice')}</span><span class="copy"><strong>${r.plate} · ${r.customer}</strong><small>${r.vehicle} · ${mode==='invoicePending'?r.jobRef:mode==='estimatePending'?r.estimateRef:r.invoiceRef}</small><small>${info?info.text+' · '+nice(info.anchor,'year'):status(r)+' · '+nice(r.invoiceAt||r.jobAt||r.createdAt,'year')}</small></span><span class="end">${lineValue(r,mode)}<small>${I('chevron-right','small')}</small></span></button>`}).join('')||'<p class="placeholder-empty">No matching records for these filters.</p>'}
function refreshDrillResults(){let rows=sortedDrillRows(),mode=sheetParams.mode;document.getElementById('drillResults').innerHTML=makeResults(rows,mode);document.querySelector('.results-head span').textContent=`${fmtNum(rows.length)} records${isMoney(mode)?' · '+money(rows.reduce((s,r)=>s+(mode==='pendingAmt'||mode==='overdue'?pending(r):mode==='collected'?paid(r):r.total),0)):''}`}
function detail(id,parent='drill'){const original=ids.get(id);if(!original)return;const r=record(original);detailsId=id;sheetParams.parent=parent;let steps=[['Vehicle In',r.createdAt],['Estimated',r.estimateAt],['Job card created',r.jobAt],['Work completed',r.workDoneAt],['QC approved',r.qcAt],['Invoice issued',r.invoiceAt]].filter(x=>x[1]&&x[1]<=TODAY);
let ageDesc=status(r)==='Invoice Pending'?ageinfo(r,'invoicePending')?.text:invoiced(r)?ageinfo(r,'pendingAmt')?.text:null;
const facts=[['Registration',r.plate],['Visit ID',r.id],['Status',status(r)],['Opened',nice(r.createdAt,'year')],['Service',r.service],['Job card',r.jobAt&&r.jobAt<=TODAY?r.jobRef:'—'],...(finance()&&invoiced(r)?[['Invoice total',money(r.total)],['Collected',money(paid(r))],['Pending',money(pending(r))],['Due date',nice(r.dueAt,'year')]]:[]),...(ageDesc?[['Aging',ageDesc]]:[])];
let action='';let st=status(r);if(st==='Estimate Pending'&&role!=='accounts')action=`<div class="demo-action"><strong>Create job card</strong><small>Demo workflow: approve estimate and open a job card.</small><button class="primary" data-action="advance" data-step="job" data-id="${id}">Create job card</button></div>`;
if(st==='QC Pending'&&role!=='accounts')action=`<div class="demo-action"><strong>QC completed?</strong><small>Mark quality check approved for this sample vehicle.</small><button class="primary" data-action="advance" data-step="qc" data-id="${id}">Approve QC</button></div>`;
if(st==='Invoice Pending'&&role!=='accounts')action=`<div class="demo-action"><strong>Issue invoice</strong><small>Generates a demo invoice for the current vehicle.</small><button class="primary" data-action="advance" data-step="invoice" data-id="${id}">Issue invoice</button></div>`;
if(invoiced(r)&&pending(r)>0&&finance())action=`<div class="demo-action"><strong>Record payment</strong><small>Collects the outstanding balance on this sample invoice.</small><button class="primary" data-action="advance" data-step="pay" data-id="${id}">Record ${money(pending(r))}</button></div>`;
const body=`<button class="secondary" data-action="backList" style="margin-bottom:16px">${I('arrow-left','small')} Back</button><h4 class="detail-name">${r.customer}</h4><div class="detail-sub">${r.vehicle} · ${r.plate}</div><div class="detail-grid">${facts.map(([k,v])=>`<div><small>${k}</small><strong>${v}</strong></div>`).join('')}</div><h4>Service timeline</h4><div class="steps">${steps.map(([label,d])=>`<div class="step"><strong>${label}</strong><small>${nice(d,'year')}</small></div>`).join('')}</div>${action}`;
openSheet('detail','Vehicle details',r.id,body)}
function actionRecord(id,step){const r=record(ids.get(id)),p=patches[id]||{};if(step==='job'&&status(r)==='Estimate Pending'&&role!=='accounts')p.jobAt=TODAY;
else if(step==='qc'&&status(r)==='QC Pending'&&role!=='accounts')p.qcAt=TODAY;
else if(step==='invoice'&&status(r)==='Invoice Pending'&&role!=='accounts'){p.invoiceAt=TODAY;p.invoiceTime='14:00';p.dueAt=add(TODAY,14)}
else if(step==='pay'&&finance()&&invoiced(r)&&pending(r)>0)p.payments=[...r.payments,{at:TODAY,amount:pending(r)}];else{toast('Action unavailable for this role or status');return}
patches[id]=p;save(LS_ACTIONS,patches);render();detail(id,'drill');toast('Demo record updated')}
function downloadCsv(){let rows=sortedDrillRows(),mode=sheetParams.mode;const fields=['Visit','Registration','Customer','Vehicle','Status','Created','Invoice date','Invoice amount AED','Collected AED','Pending AED','Aging days','Due date'];const cell=x=>'"'+String(x??'').replaceAll('"','""')+'"';const lines=[fields.join(',')];rows.forEach(r=>{const ai=ageMode(mode)?ageinfo(r,mode):null;lines.push([r.id,r.plate,r.customer,r.vehicle,status(r),r.createdAt,r.invoiceAt,finance()?r.total:'',finance()?paid(r):'',finance()?pending(r):'',ai?.days??'',r.dueAt].map(cell).join(','))});const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`garage360-mobile-${mode}-${period.from}-${period.to}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast('CSV exported')}
// Event delegation keeps dynamically rendered controls working after changes.
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='dates')dateSheet();
else if(a==='chooseDate'){const p=pset.find(p=>p[0]===b.dataset.key);if(p)setPeriod(p[0],p[2],p[3])}
else if(a==='applyCustom'){const from=document.getElementById('dateStart').value,to=document.getElementById('dateEnd').value;if(!from||!to||from>to){document.getElementById('dateError').textContent='Please choose valid dates (From must not exceed To).';return}setPeriod('custom',from,to)}
else if(a==='roles')rolesSheet();else if(a==='selectRole'){role=b.dataset.role;save(LS_ROLE,role);render();closeSheet();toast('Preview role: '+ROLES[role])}
else if(a==='page'){page=b.dataset.page;render();scrollTo({top:0,behavior:'instant'});closeSheet()}
else if(a==='metric'||a==='queue')drill(b.dataset.mode);
else if(a==='bar'){if(!finance())return;drill('invoiced',Number(b.dataset.bin))}
else if(a==='detail')detail(b.dataset.id,b.dataset.parent||'drill');else if(a==='backList'){if(sheetParams.parent==='recent'){closeSheet();return}paintDrill()}
else if(a==='customize')customize();else if(a==='theme'){theme=b.dataset.theme;document.documentElement.dataset.theme=theme;save(LS_THEME,theme);customize();toast('Theme saved')}
else if(a==='moveWidget'){const c=cfg(),list=[...c.metrics],n=list.indexOf(b.dataset.key),i=n+Number(b.dataset.dir);if(n!==-1&&i>=0&&i<list.length){[list[n],list[i]]=[list[i],list[n]];c.metrics=list;updateCfg(c);customize()}}
else if(a==='restore'){layouts[role]=structuredClone(DEFAULT[role]);save(LS_LAYOUT,layouts);render();customize();toast('Role layout restored')}
else if(a==='done')closeSheet();else if(a==='ageFilter'){agingFilter=b.dataset.filter;paintDrill()}
else if(a==='advance')actionRecord(b.dataset.id,b.dataset.step);else if(a==='exportCsv')downloadCsv();
else if(a==='reset'){if(confirm('Reset demo workflow actions?')){patches={};save(LS_ACTIONS,patches);render();toast('Sample data restored')}}
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.action!=='toggleWidget')return;const c=cfg(),section=el.dataset.section,key=el.dataset.key;if(section==='misc'){if(key==='chart'&&!ALLOWED[role].chart)return;c[key]=el.checked}else{const allowed=ALLOWED[role][section];if(!allowed.includes(key))return;c[section]=el.checked?[...c[section],key]:c[section].filter(x=>x!==key)}updateCfg(c);customize();toast('Widget preference saved')});
document.addEventListener('input',ev=>{if(ev.target.id==='drillSearch'){sheetQuery=ev.target.value;refreshDrillResults()}});
document.getElementById('topCustomize').addEventListener('click',customize);
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;closeSheet();render();scrollTo({top:0,behavior:'instant'})}));
document.getElementById('closeSheet').addEventListener('click',closeSheet);
document.getElementById('backdrop').addEventListener('click',closeSheet);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet()});
render();
</script></body></html>
